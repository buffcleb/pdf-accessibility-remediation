name: Accessibility checks

# axe-core over the web app's main pages, as a person, a group admin and a super admin, in light and dark (#369;
# scripts/a11y.sh). Only when started by hand from the Actions tab, to save minutes; run it locally the same way.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    name: axe (WCAG 2.2 AA)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portal
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U portal" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            portal/requirements.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/a11y.sh
        env:
          PYTHON: python
          PORTAL_TEST_DATABASE_URL: postgresql+psycopg://portal:test@localhost:${{ job.services.postgres.ports['5432'] }}/portal
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: axe-report
          path: web/a11y/report.json
          if-no-files-found: ignore
