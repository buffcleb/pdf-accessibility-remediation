name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERAPDF_PATH: /opt/verapdf/verapdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            portal/requirements.txt
      - name: System packages (OCR, fonts, Java for veraPDF, Pango for the PDF report)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-17-jre-headless tesseract-ocr tesseract-ocr-eng \
            fonts-dejavu-core fonts-liberation2 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: veraPDF
        run: |
          curl -fsSL -o /tmp/verapdf.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf
          sudo java -jar "$(find /tmp/verapdf -name 'verapdf-izpack-installer-*.jar' | head -1)" docker/verapdf-auto-install.xml
          /opt/verapdf/verapdf --version
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/engine

  portal:
    name: Portal tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portal
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            portal/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/portal

  web:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
