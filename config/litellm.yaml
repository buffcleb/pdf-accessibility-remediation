# AI gateway (LiteLLM) models. Each model_name is what the service's AI levels point at; super admins
# publish a model as an AI level in Administration > Services. Hosts and keys come from the environment
# (.env), never from this file.
#
# Add cloud or commercial models by uncommenting an entry and setting its key in .env. They do nothing
# until a super admin creates an AI level for them and groups enable it.

model_list:
  # --- local models (your own servers) -------------------------------------------------------------------------
  - model_name: local-vision           # alt text, tables, reading order
    litellm_params:
      model: os.environ/LOCAL_VISION_MODEL   # e.g. openai/qwen3-vl-8b-instruct
      api_base: os.environ/LOCAL_AI_BASE_URL
      api_key: os.environ/LOCAL_AI_API_KEY
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: local-judge            # the review model: a different family from the vision model
    litellm_params:
      model: os.environ/LOCAL_JUDGE_MODEL    # e.g. openai/gemma-4-26b-a4b-it-qat-q4_0
      api_base: os.environ/LOCAL_AI_BASE_URL
      api_key: os.environ/LOCAL_AI_API_KEY
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # More than one local AI server: repeat an entry with the same model_name and another api_base (another
  # environment variable, e.g. LOCAL_AI_BASE_URL_2). The gateway spreads requests over the entries of one name.
  # How many documents use a local model at once is set in the portal, not here: the AI level's "Most documents
  # at once" (Administration > Services), so the rest wait in the queue and none fail on a busy GPU.

  # --- hosted models: open-weight and commercial -----------------------------------------------------
  # Names say family, size and role (open-large-vision), never the model or its version: the model behind a name
  # can be replaced here without touching the AI levels that point at it. The family is what a writer and its
  # judge must differ in.
  # Each AI level (and kind of document) has a writer model and a review (judge) model. Pair every writer with a judge from a
  # DIFFERENT model family (a model tends to approve its own mistakes), e.g. Qwen writes, Gemma reviews.
  #
  # Writers:
  - model_name: open-small-vision         # the local model's family, hosted
    litellm_params:
      model: openrouter/qwen/qwen3-vl-8b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: open-large-vision         # a much larger model of that family
    litellm_params:
      model: openrouter/qwen/qwen3-vl-235b-a22b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: commercial-small-vision   # a commercial vendor's small model, at a fraction of the price
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: commercial-medium-vision  # its everyday model
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: commercial-large-vision   # the vendor's largest: for a kind of document that needs it (Math and science)
    litellm_params:
      model: openrouter/anthropic/claude-opus-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  #
  # Judges:
  - model_name: open-judge            # Gemma, hosted: reviews the open writers (Qwen), and
                                      # commercial-small-vision (a reviewer shouldn't cost more than its writer)
    litellm_params:
      model: openrouter/google/gemma-4-31b-it
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: commercial-judge      # Gemini: reviews commercial-medium-vision and commercial-large-vision (Claude)
    litellm_params:
      model: openrouter/google/gemini-3.8-flash
      api_key: os.environ/OPENROUTER_API_KEY
  #
  # --- AWS Bedrock -----------------------------------------------------------------------------------------------
  # Through the gateway's AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION_NAME: the gateway's
  # secret only), with "us." cross-region profiles: AWS may run a request in us-east-1, us-east-2 or us-west-2, never
  # outside the US (a "global." profile could). Each model must be available to the AWS account: Bedrock's service
  # quotas, and a first call from someone allowed to subscribe to it (docs/operations/ai-models.md#aws-bedrock).
  # The prices are Bedrock's list prices, for the cost the portal reports (the gateway may not know these models).
  #
  # Trial writers (trial-a-vision, …): a model being compared against the chosen one; removed when the comparison is
  # done.
  - model_name: trial-a-vision            # Amazon's Nova Lite, on Bedrock: a different family from Claude and Gemma
    litellm_params:
      model: bedrock/converse/us.amazon.nova-lite-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME
    model_info:
      input_cost_per_token: 0.00000006    # $0.06 per million (Bedrock, October 2026)
      output_cost_per_token: 0.00000024   # $0.24 per million
  #
  # Then in the portal (Administration > Services > Add an AI level), choose each level's writer and review
  # model, e.g. "Large AI" = open-large-vision + open-judge, "Commercial AI" = commercial-medium-vision + commercial-judge.
  # A level or kind of document that names a model no longer listed here must be pointed at one that is.

litellm_settings:
  drop_params: true                    # backends that don't take an option (JSON mode, reasoning) ignore it
  request_timeout: 180
  num_retries: 2
  # Backstop for spend across all models, on top of the portal's page quotas: USD per budget period.
  # Set it for your deployment; local models cost nothing, so it only bites on cloud/commercial use.
  max_budget: 150
  budget_duration: 30d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  # The Jev classifier (OpenRouter's System One API, not a chat model): the engine calls /systemone here with its
  # gateway key, and the gateway adds the OpenRouter key, so the engine needs neither the key nor the internet
  # (#361). Unused unless a super admin picks Jev for "Let AI decide".
  pass_through_endpoints:
    - path: /systemone
      target: https://openrouter.ai/api/v1/systemone
      headers:
        Authorization: "Bearer os.environ/OPENROUTER_API_KEY"
        X-Title: PDF Accessibility Remediation
      forward_headers: false
