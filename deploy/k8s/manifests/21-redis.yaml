# The engine's queues: its Celery broker (db 0), and the music and formula readers' work lists. A password
# (REDIS_PASSWORD in engine.env) and the network policies in 80-network-policies.yaml keep them to the engine's pods.
# The portal has a Redis of its own (23-redis-portal.yaml, #472).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ${NAMESPACE}
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ${NAMESPACE}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      # Restarted when its password changes (scripts/deploy.sh)
      annotations: { checksum/password: "${REDIS_KEY_SHA}" }
    spec:
      automountServiceAccountToken: false  # no Kubernetes API access (#470)
      securityContext: { fsGroup: 999, runAsUser: 999, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          # With no ceiling a flood of requests (a 40 MB score per job, say) grows until the container is killed and the
          # queues with it; past the ceiling a write is refused instead, which the sender reports
          args: ["--appendonly", "yes", "--dir", "/data", "--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: pdfrem-engine-env, key: REDIS_PASSWORD } }
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${STORAGE_CLASS}
        resources: { requests: { storage: ${REDIS_SIZE} } }
