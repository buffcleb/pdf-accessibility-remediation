# S3-compatible store for the portal's files (input and output PDFs, reports). Inside the cluster only.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: ${NAMESPACE}
spec:
  selector: { app: seaweedfs }
  ports: [{ name: s3, port: 8333 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: ${NAMESPACE}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          command: ["/bin/sh", "-c"]
          args:
            - >
              mkdir -p /etc/sw &&
              printf '{"identities":[{"name":"portal","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
              "$S3_ACCESS" "$S3_SECRET" > /etc/sw/s3.json &&
              mkdir -p /etc/seaweedfs && printf '[s3.sse]\nkek = "%s"\n' "$S3_SSE_KEK" > /etc/seaweedfs/security.toml &&
              exec weed server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/sw/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
          env:
            - name: S3_ACCESS
              valueFrom: { secretKeyRef: { name: pdfrem-portal-env, key: PORTAL_S3_ACCESS_KEY } }
            - name: S3_SECRET
              valueFrom: { secretKeyRef: { name: pdfrem-portal-env, key: PORTAL_S3_SECRET_KEY } }
            - name: S3_SSE_KEK
              valueFrom: { secretKeyRef: { name: pdfrem-portal-env, key: PORTAL_S3_SSE_KEK } }
          ports: [{ containerPort: 8333 }]
          readinessProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${STORAGE_CLASS}
        resources: { requests: { storage: ${FILES_SIZE} } }
