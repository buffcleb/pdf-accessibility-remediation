# The remediation engine: its API (inside the cluster only; the portal calls it), the standard-route workers,
# the Adobe-route workers (0 unless Adobe is set up) and the scheduler that clears old jobs.
apiVersion: v1
kind: Service
metadata:
  name: engine
  namespace: ${NAMESPACE}
spec:
  selector: { app: engine-api }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-api
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: { app: engine-api }
  template:
    metadata:
      labels: { app: engine-api }
      annotations:
        checksum/settings: "${ENGINE_ENV_SHA}"
        # The queues' lengths, for Prometheus when MONITORING=on (#397)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /api/v1/metrics
    spec:
      automountServiceAccountToken: false  # no Kubernetes API access (#470)
${ENGINE_PLACEMENT}
      imagePullSecrets: [{ name: pdfrem-ghcr }]
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: check-jobdata
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["sh", "-c", "touch /data/.write-test && rm /data/.write-test || { echo 'The job folder (StorageClass ${SHARED_STORAGE_CLASS}) is not writable by uid 10001. In DSM, set the NFS rule of the share to map all users to admin.'; exit 1; }"]
          volumeMounts: [{ name: jobdata, mountPath: /data }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: engine-api
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          envFrom: [{ secretRef: { name: pdfrem-engine-env } }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: pdfrem-engine-env, key: REDIS_PASSWORD } }
            - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0" }
            - { name: DATA_DIR, value: /data }
            - { name: GATEWAY_BASE_URL, value: "http://litellm:4000/v1" }
            - { name: AI_GATEWAY_ONLY, value: "true" }  # no AI provider but the gateway (#361)
            - { name: VERAPDF_URL, value: "http://verapdf:8080" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            periodSeconds: 10
          # Liveness (#335) only asks whether the process answers: Redis or veraPDF being away mustn't restart it
          livenessProbe:
            httpGet: { path: /api/v1/live, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
          # Nothing is written outside /tmp (its caches point there) and the job folder
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: jobdata, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: jobdata
          persistentVolumeClaim: { claimName: jobdata }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-worker
  namespace: ${NAMESPACE}
spec:
  ${ENGINE_WORKER_REPLICAS}
  selector:
    matchLabels: { app: engine-worker }
  template:
    metadata:
      labels: { app: engine-worker }
      annotations:
        checksum/settings: "${ENGINE_ENV_SHA}"
        # How many documents it's working on, of how many it can take (#397)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      automountServiceAccountToken: false  # no Kubernetes API access (#470)
${ENGINE_PLACEMENT}
      # A worker told to stop (scaling down, a new release) finishes the document it's on first
      terminationGracePeriodSeconds: ${WORKER_GRACE_SECONDS}
      imagePullSecrets: [{ name: pdfrem-ghcr }]
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: check-jobdata
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["sh", "-c", "touch /data/.write-test && rm /data/.write-test || { echo 'The job folder (StorageClass ${SHARED_STORAGE_CLASS}) is not writable by uid 10001. In DSM, set the NFS rule of the share to map all users to admin.'; exit 1; }"]
          volumeMounts: [{ name: jobdata, mountPath: /data }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: engine-worker
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY}"]
          ports: [{ name: metrics, containerPort: 9464 }]
          # Liveness (#335): the worker's event loop touches /tmp/worker.alive every 30 s while it's connected and
          # taking tasks (app/worker/celery_app.py). Stale for 3 minutes, three checks running: restarted. A long
          # document doesn't stop it (tasks run in child processes); a document cut off is handed out again.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker.alive') > 180)"]
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom: [{ secretRef: { name: pdfrem-engine-env } }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: pdfrem-engine-env, key: REDIS_PASSWORD } }
            - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0" }
            - { name: DATA_DIR, value: /data }
            - { name: GATEWAY_BASE_URL, value: "http://litellm:4000/v1" }
            - { name: AI_GATEWAY_ONLY, value: "true" }  # no AI provider but the gateway (#361)
            - { name: VERAPDF_URL, value: "http://verapdf:8080" }
            - { name: OMR_ENABLED, value: "${OMR_ENABLED}" }
            - { name: MUSIC_MAX_EXAMPLES, value: "${MUSIC_MAX_EXAMPLES}" }
            - { name: MUSIC_MAX_SCORE_LINES, value: "${MUSIC_MAX_SCORE_LINES}" }
            - { name: MUSIC_PER_MEASURE, value: "${MUSIC_PER_MEASURE}" }
            - { name: MUSIC_WHOLE_SCORE, value: "${MUSIC_WHOLE_SCORE}" }
            - { name: MUSIC_WHOLE_SCORE_MAX_MB, value: "${MUSIC_WHOLE_SCORE_MAX_MB}" }
            - { name: OMR_TIMEOUT_S, value: "${MUSIC_WAIT_SECONDS}" }
            - { name: OMR_PAGE_TIMEOUT_S, value: "${MUSIC_PAGE_SECONDS}" }
            - { name: FORMULA_OCR_ENABLED, value: "${FORMULA_OCR_ENABLED}" }  # a second reading of formulas (#403)
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "3", memory: ${WORKER_MEMORY_LIMIT}, ephemeral-storage: 6Gi }
          # Nothing is written outside /tmp (its caches point there) and the job folder
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: jobdata, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: jobdata
          persistentVolumeClaim: { claimName: jobdata }
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }  # OCR renders and the validator's copies; a document past this is evicted, not the node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-adobe-worker
  namespace: ${NAMESPACE}
spec:
  replicas: ${ADOBE_WORKERS}
  selector:
    matchLabels: { app: engine-adobe-worker }
  template:
    metadata:
      labels: { app: engine-adobe-worker }
      annotations:
        checksum/settings: "${ENGINE_ENV_SHA}"
        # How many documents it's working on, of how many it can take (#397)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      automountServiceAccountToken: false  # no Kubernetes API access (#470)
${ENGINE_PLACEMENT}
      imagePullSecrets: [{ name: pdfrem-ghcr }]
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: check-jobdata
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["sh", "-c", "touch /data/.write-test && rm /data/.write-test || { echo 'The job folder (StorageClass ${SHARED_STORAGE_CLASS}) is not writable by uid 10001. In DSM, set the NFS rule of the share to map all users to admin.'; exit 1; }"]
          volumeMounts: [{ name: jobdata, mountPath: /data }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: engine-adobe-worker
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "adobe", "-n", "adobe@%h", "--loglevel=INFO", "--concurrency=2"]
          ports: [{ name: metrics, containerPort: 9464 }]
          # Liveness (#335): the worker's event loop touches /tmp/worker.alive every 30 s while it's connected and
          # taking tasks (app/worker/celery_app.py). Stale for 3 minutes, three checks running: restarted. A long
          # document doesn't stop it (tasks run in child processes); a document cut off is handed out again.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker.alive') > 180)"]
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom: [{ secretRef: { name: pdfrem-engine-env } }, { secretRef: { name: pdfrem-adobe-env } }]
          env:
${EGRESS_PROXY_ENV}
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: pdfrem-engine-env, key: REDIS_PASSWORD } }
            - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0" }
            - { name: DATA_DIR, value: /data }
            - { name: GATEWAY_BASE_URL, value: "http://litellm:4000/v1" }
            - { name: AI_GATEWAY_ONLY, value: "true" }  # no AI provider but the gateway (#361)
            - { name: VERAPDF_URL, value: "http://verapdf:8080" }
            - { name: OMR_ENABLED, value: "${OMR_ENABLED}" }
            - { name: MUSIC_MAX_EXAMPLES, value: "${MUSIC_MAX_EXAMPLES}" }
            - { name: MUSIC_MAX_SCORE_LINES, value: "${MUSIC_MAX_SCORE_LINES}" }
            - { name: MUSIC_PER_MEASURE, value: "${MUSIC_PER_MEASURE}" }
            - { name: MUSIC_WHOLE_SCORE, value: "${MUSIC_WHOLE_SCORE}" }
            - { name: MUSIC_WHOLE_SCORE_MAX_MB, value: "${MUSIC_WHOLE_SCORE_MAX_MB}" }
            - { name: OMR_TIMEOUT_S, value: "${MUSIC_WAIT_SECONDS}" }
            - { name: OMR_PAGE_TIMEOUT_S, value: "${MUSIC_PAGE_SECONDS}" }
            - { name: FORMULA_OCR_ENABLED, value: "${FORMULA_OCR_ENABLED}" }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi }
          # Nothing is written outside /tmp (its caches point there) and the job folder
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: jobdata, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: jobdata
          persistentVolumeClaim: { claimName: jobdata }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-beat
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: { app: engine-beat }
  template:
    metadata:
      labels: { app: engine-beat }
      annotations:
        checksum/settings: "${ENGINE_ENV_SHA}"
    spec:
      automountServiceAccountToken: false  # no Kubernetes API access (#470)
${ENGINE_PLACEMENT}
      imagePullSecrets: [{ name: pdfrem-ghcr }]
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: check-jobdata
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["sh", "-c", "touch /data/.write-test && rm /data/.write-test || { echo 'The job folder (StorageClass ${SHARED_STORAGE_CLASS}) is not writable by uid 10001. In DSM, set the NFS rule of the share to map all users to admin.'; exit 1; }"]
          volumeMounts: [{ name: jobdata, mountPath: /data }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: engine-beat
          image: ${REGISTRY}/pdfrem-engine:${ENGINE_TAG}
          command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
          envFrom: [{ secretRef: { name: pdfrem-engine-env } }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: pdfrem-engine-env, key: REDIS_PASSWORD } }
            - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0" }
            - { name: DATA_DIR, value: /data }
            - { name: GATEWAY_BASE_URL, value: "http://litellm:4000/v1" }
            - { name: AI_GATEWAY_ONLY, value: "true" }  # no AI provider but the gateway (#361)
            - { name: VERAPDF_URL, value: "http://verapdf:8080" }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi, ephemeral-storage: 256Mi }
          # Nothing is written outside /tmp (its caches point there) and the job folder
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: jobdata, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: jobdata
          persistentVolumeClaim: { claimName: jobdata }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
