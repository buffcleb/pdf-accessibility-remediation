# The formula reading service runs only while there are pictures to read (applied when FORMULA_READER=on and scaling
# is on, #403): KEDA starts a pod when something is put on the Redis list, one more per ${FORMULA_PER_POD} waiting up
# to ${FORMULA_MAX}, and removes them ${SCALE_DOWN_SECONDS} seconds after the list was last in use.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: formula-queue
  namespace: ${NAMESPACE}
spec:
  secretTargetRef:
    - { parameter: password, name: pdfrem-engine-env, key: REDIS_PASSWORD }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: formula-reader
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef: { name: formula-reader }
  minReplicaCount: 0
  maxReplicaCount: ${FORMULA_MAX}
  pollingInterval: 5
  cooldownPeriod: ${SCALE_DOWN_SECONDS}
  triggers:
    - type: redis
      authenticationRef: { name: formula-queue }
      metadata:
        address: redis.${NAMESPACE}.svc.cluster.local:6379
        databaseIndex: "0"
        listName: "formula:requests"
        listLength: "${FORMULA_PER_POD}"
