# The web app (static files) and the one public entry: https://${APP_HOST} -> web, which proxies /api/ to the
# portal API. Traffic arrives through the Cloudflare tunnel to ingress-nginx; TLS ends at Cloudflare.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ${NAMESPACE}
spec:
  selector: { app: web }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      automountServiceAccountToken: false  # no Kubernetes API access (#470)
      imagePullSecrets: [{ name: pdfrem-ghcr }]
      securityContext: { runAsUser: 101, runAsGroup: 101, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ${REGISTRY}/pdfrem-web:${WEB_TAG}
          env:
            - { name: PORTAL_API_UPSTREAM, value: "http://portal-api:8080" }
            - { name: MAX_UPLOAD_SIZE, value: "${MAX_UPLOAD_SIZE}" }
            - { name: TRUSTED_PROXIES, value: "${WEB_TRUSTED_PROXIES}" }
            # cloudflared's range: only from there is Cloudflare's caller header passed on (#336)
            - { name: TUNNEL_PROXIES, value: "${TRUSTED_PROXY_CIDRS}" }
            # Grafana at /grafana for super admins (#397, docker/web/16-grafana.sh); empty with MONITORING=off
            - { name: GRAFANA_UPSTREAM, value: "${GRAFANA_UPSTREAM}" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi, ephemeral-storage: 1536Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: confd, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        # A download to a slow client is spooled under the cache (proxy_max_temp_file_size, 1 GB by default)
        - { name: cache, emptyDir: { sizeLimit: 1Gi } }
        - { name: confd, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ${NAMESPACE}
  # The controller's own settings (INGRESS_CONTROLLER; scripts/deploy.sh), and cert-manager's issuer
  annotations:
    pdfrem/ingress-controller: "${INGRESS_CONTROLLER}"
${INGRESS_ANNOTATIONS}
${INGRESS_ISSUER}
spec:
  ingressClassName: ${INGRESS_CLASS}
${INGRESS_TLS}
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 8080 } }
