# Only with FRONTEND=worker: the portal API on its own host (https://${API_ORIGIN_HOST}), which the Cloudflare
# Worker forwards /api/ to. Protect that host with Cloudflare Access (a service token the Worker sends).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-origin
  namespace: ${NAMESPACE}
  # The controller's own settings (INGRESS_CONTROLLER; scripts/deploy.sh), with its allow-list: only the proxies in
  # front of it (Cloudflare's ranges), as anyone else could name themselves in its header (#336)
  annotations:
    pdfrem/ingress-controller: "${INGRESS_CONTROLLER}"
${API_ORIGIN_ANNOTATIONS}
spec:
  ingressClassName: ${INGRESS_CLASS}
  rules:
    - host: ${API_ORIGIN_HOST}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service: { name: portal-api, port: { number: 8080 } }
