# Who may talk to what, inside the cluster. Without these, every pod in every namespace could reach the queues, the
# database, the file store, the validator, the AI gateway and the engine's API (none of which asks who is calling,
# apart from Postgres and the gateway). Each policy below selects one service and lists the pods allowed in; a pod
# selected by a policy with no matching rule is closed to everything else. Pods not named here (the web pod,
# cloudflared) keep the cluster's default: open.
#
# Probes from the kubelet and traffic between the pods named here are the only flows these services need. The
# ingress controller reaches only the web pod (60-web.yaml), or the portal API in the Worker front end
# (81-api-origin-policy.yaml).
#
# Egress: the pods that open uploaded PDFs (the engine's API, workers and scheduler, and the music reader) reach only
# the cluster services they use and DNS, so an engine taken over by a crafted PDF can't send anything out (#361).
# Their AI calls go through the gateway (AI_GATEWAY_ONLY in 40-engine.yaml). The gateway, the Adobe worker (Adobe's
# API) and the portal keep their internet access. The job folder is an NFS mount made by the node, not the pod, so
# it isn't affected.
#
# Monitoring (#397, 95-monitoring.yaml): Prometheus reads the metrics of the portal, the engine and the workers on
# their own ports, and its exporters reach Postgres and Redis. The rules for it are here whether or not it's
# deployed; with no Prometheus pod they let nothing in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: portal-api } }
        - podSelector: { matchLabels: { app: portal-worker } }
        - podSelector: { matchLabels: { app: litellm } }
        - podSelector: { matchLabels: { app: portal-migrate } }
        # The nightly backup's database dumps (90-backup.yaml, BACKUPS=cronjob)
        - podSelector: { matchLabels: { app: backup } }
        # KEDA reads the queue's length from the portal's database (45-autoscale.yaml)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keda } }
        # Postgres's own statistics, through an account that reads no table (deploy/k8s/monitoring-role.sql)
        - podSelector: { matchLabels: { app: postgres-exporter } }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: engine-api } }
        - podSelector: { matchLabels: { app: engine-worker } }
        - podSelector: { matchLabels: { app: engine-adobe-worker } }
        - podSelector: { matchLabels: { app: engine-beat } }
        - podSelector: { matchLabels: { app: portal-api } }
        - podSelector: { matchLabels: { app: portal-worker } }
        - podSelector: { matchLabels: { app: music-reader } }
        - podSelector: { matchLabels: { app: formula-reader } }  # the formula reading service (37-formula.yaml)
        # KEDA reads the music and formula queues' lengths (46-music-autoscale.yaml, 47-formula-autoscale.yaml)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keda } }
        - podSelector: { matchLabels: { app: redis-exporter } }
      ports: [{ port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: seaweedfs } }
  policyTypes: [Ingress]
  ingress:
    # Only the S3 port, which checks a key; the master, filer and volume ports it also listens on check nothing
    - from:
        - podSelector: { matchLabels: { app: portal-api } }
        - podSelector: { matchLabels: { app: portal-worker } }
        - podSelector: { matchLabels: { app: backup } }  # the nightly backup's copy of the stored files
      ports: [{ port: 8333 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verapdf
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: verapdf } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: engine-api } }
        - podSelector: { matchLabels: { app: engine-worker } }
        - podSelector: { matchLabels: { app: engine-adobe-worker } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: litellm } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: engine-api } }
        - podSelector: { matchLabels: { app: engine-worker } }
        - podSelector: { matchLabels: { app: engine-adobe-worker } }
        - podSelector: { matchLabels: { app: portal-api } }
        - podSelector: { matchLabels: { app: portal-worker } }
      ports: [{ port: 4000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: engine
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: engine-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: portal-api } }
        - podSelector: { matchLabels: { app: portal-worker } }
        - podSelector: { matchLabels: { app: prometheus } }  # /api/v1/metrics
      ports: [{ port: 8000 }]
---
# The workers and the scheduler take their work from Redis and answer no one but Prometheus, on their metrics port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: engine-workers
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [engine-worker, engine-adobe-worker, engine-beat, portal-worker, music-reader,
                                           formula-reader] }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: prometheus } } }]
      ports: [{ port: 9464 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-api
  namespace: ${NAMESPACE}
spec:
  podSelector: { matchLabels: { app: portal-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: web } }
        - podSelector: { matchLabels: { app: cloudflared } }
        - podSelector: { matchLabels: { app: prometheus } }  # /metrics
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: engine-egress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [engine-api, engine-worker, engine-beat] }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } },
             podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ port: 6379 }]
    - to: [{ podSelector: { matchLabels: { app: verapdf } } }]
      ports: [{ port: 8080 }]
    - to: [{ podSelector: { matchLabels: { app: litellm } } }]
      ports: [{ port: 4000 }]
---
# The music reader and the formula reader take their pictures from Redis and answer there
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: music-egress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [music-reader, formula-reader] }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } },
             podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ port: 6379 }]
