# Applies the portal's database migrations once (scripts/deploy.sh runs it after backing up the database).
apiVersion: batch/v1
kind: Job
metadata:
  name: portal-migrate-${RUN_ID}
  namespace: ${NAMESPACE}
  labels: { app: portal-migrate }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: pdfrem-ghcr }]
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true }
      containers:
        - name: migrate
          image: ${REGISTRY}/pdfrem-portal:${PORTAL_TAG}
          command: ["python", "-m", "portal.cli", "migrate"]
          envFrom: [{ secretRef: { name: pdfrem-portal-env } }]
          env:
            - name: PORTAL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pdfrem-portal-env, key: PORTAL_DB_PASSWORD } }
            - { name: PORTAL_DATABASE_URL, value: "postgresql+psycopg://portal:$(PORTAL_DB_PASSWORD)@postgres:5432/portal" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
