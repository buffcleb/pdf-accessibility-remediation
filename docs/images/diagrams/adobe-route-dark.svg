<rect x="125" y="91" width="134" height="13" fill="#10141a"/><text x="192" y="101" class="p" text-anchor="middle" fill="#9ca8b8">submit, route = adobe</text><rect x="341" y="127" width="86" height="13" fill="#10141a"/><text x="384" y="137" class="p" text-anchor="middle" fill="#9ca8b8">queue &#x27;adobe&#x27;</text><rect x="512" y="174" width="212" height="13" fill="#10141a"/><text x="516" y="184" class="p" text-anchor="start" fill="#9ca8b8">veraPDF and audit of the original;</text><rect x="512" y="187" width="176" height="13" fill="#10141a"/><text x="516" y="197" class="p" text-anchor="start" fill="#9ca8b8">split if over Adobe&#x27;s limits</text><rect x="497" y="229" width="158" height="13" fill="#14181e"/><text x="576" y="239" class="p" text-anchor="middle" fill="#9ca8b8">a slot and request budget</text><rect x="560" y="265" width="224" height="13" fill="#14181e"/><text x="672" y="275" class="p" text-anchor="middle" fill="#9ca8b8">token (cached), create asset, upload</text><rect x="578" y="301" width="188" height="13" fill="#14181e"/><text x="672" y="311" class="p" text-anchor="middle" fill="#9ca8b8">start Autotag; poll until done</text><rect x="581" y="337" width="182" height="13" fill="#14181e"/><text x="672" y="347" class="p" text-anchor="middle" fill="#9ca8b8">tagged PDF and Adobe&#x27;s report</text><rect x="617" y="373" width="110" height="13" fill="#14181e"/><text x="672" y="383" class="p" text-anchor="middle" fill="#9ca8b8">delete the assets</text><rect x="512" y="440" width="158" height="13" fill="#10141a"/><text x="516" y="450" class="p" text-anchor="start" fill="#9ca8b8">merge the parts; veraPDF,</text><rect x="512" y="453" width="140" height="13" fill="#10141a"/><text x="516" y="463" class="p" text-anchor="start" fill="#9ca8b8">tag integrity, tag map</text><rect x="512" y="490" width="188" height="13" fill="#10141a"/><text x="516" y="500" class="p" text-anchor="start" fill="#9ca8b8">AI alt text where it&#x27;s missing</text><rect x="512" y="503" width="98" height="13" fill="#10141a"/><text x="516" y="513" class="p" text-anchor="start" fill="#9ca8b8">(on by default)</text><rect x="512" y="540" width="206" height="13" fill="#10141a"/><text x="516" y="550" class="p" text-anchor="start" fill="#9ca8b8">improved copy: alt text, document</text><rect x="512" y="553" width="206" height="13" fill="#10141a"/><text x="516" y="563" class="p" text-anchor="start" fill="#9ca8b8">and font fixes, bookmarks, checks</text><rect x="110" y="579" width="164" height="13" fill="#10141a"/><text x="192" y="589" class="p" text-anchor="middle" fill="#9ca8b8">poll, then fetch the files</text>
