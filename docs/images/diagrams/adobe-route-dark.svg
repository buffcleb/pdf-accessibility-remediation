<svg viewBox="0 0 960 640" width="960" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adobe-route-dark-title adobe-route-dark-desc">
<title id="adobe-route-dark-title">The Adobe route</title>
<desc id="adobe-route-dark-desc">The engine queues an Adobe job; the Adobe worker checks the original, splits it if needed, and for each part, a few at a time, takes a rate-limit slot, uploads it to Adobe PDF Services, starts Autotag and waits, downloads the tagged PDF and report, and deletes the files at Adobe; it then merges the parts, checks Adobe&#x27;s file, adds AI alt text and writes the improved copy, which the portal worker fetches.</desc>
<defs><marker id="adobe-route-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="adobe-route-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="adobe-route-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>
<line x1="864" y1="64" x2="864" y2="616" stroke="rgba(229,233,239,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="672" y1="64" x2="672" y2="616" stroke="rgba(229,233,239,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="480" y1="64" x2="480" y2="616" stroke="rgba(229,233,239,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="288" y1="64" x2="288" y2="616" stroke="rgba(229,233,239,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="96" y1="64" x2="96" y2="616" stroke="rgba(229,233,239,0.25)" stroke-width="1" stroke-dasharray="4,4"/><rect x="392" y="206" width="560" height="208" rx="4" fill="rgba(229,233,239,0.02)" stroke="rgba(229,233,239,0.22)" stroke-width="1"/><rect x="392" y="206" width="40" height="16" rx="2" fill="#10141a" stroke="rgba(229,233,239,0.22)" stroke-width="1"/><text x="412" y="217" class="b" text-anchor="middle" fill="#9ca8b8">LOOP</text><text x="440" y="217" class="a" fill="#9ca8b8">[each part, ADOBE_MAX_CONCURRENT at once]</text>
