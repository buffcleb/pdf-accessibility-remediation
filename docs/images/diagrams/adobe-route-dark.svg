<rect x="408.0" y="16" width="144" height="48" rx="6" fill="#10141a"/><rect x="408.0" y="16" width="144" height="48" rx="6" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="480.0" y="38.0" class="n" text-anchor="middle" fill="#e5e9ef">Adobe worker</text><text x="480.0" y="52.0" class="s" text-anchor="middle" fill="#9ca8b8">adobe-worker</text>
<rect x="600.0" y="16" width="144" height="48" rx="6" fill="#10141a"/><rect x="600.0" y="16" width="144" height="48" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="672.0" y="38.0" class="n" text-anchor="middle" fill="#e5e9ef">Rate limiter</text><text x="672.0" y="52.0" class="s" text-anchor="middle" fill="#9ca8b8">Redis</text>
