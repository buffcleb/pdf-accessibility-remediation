<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aws-plan-title aws-plan-desc">
<title id="aws-plan-title">The AWS plan</title>
<desc id="aws-plan-desc">People reach an Application Load Balancer with an ACM certificate; in the VPC&#x27;s private subnets, ECS services run the web app, portal and engine, the AI gateway and the scheduler, with RDS PostgreSQL, ElastiCache Redis, an S3 bucket encrypted with KMS and EFS for the job folder; mail goes through SES, and the gateway reaches Bedrock, OpenRouter or a GPU instance. Not yet tested end to end.</desc>
