<svg viewBox="0 0 960 376" width="960" height="376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="document-lifecycle-dark-title document-lifecycle-dark-desc">
<title id="document-lifecycle-dark-title">A document&#x27;s life</title>
<desc id="document-lifecycle-dark-desc">A document waits in the queue (after being held for confirmation, for options that ask first), is processed and is then done, or fails with its pages given back; held documents can be canceled; a done document can be marked done, with 24 hours to undo, after which its files are removed, as they also are when the retention period ends.</desc>
<defs><marker id="document-lifecycle-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="document-lifecycle-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="document-lifecycle-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>

<path d="M 152,148 H 184" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 304,148 H 336" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 456,148 H 488" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 608,148 H 640" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 760,148 H 792" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 92,176 V 232" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 396,176 V 232" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 548,120 V 80 Q 548,72 556,72 H 844 Q 852,72 852,80 V 120" fill="none" stroke="#9ca8b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<path d="M 716,176 V 200 Q 716,208 708,208 H 564 Q 556,208 556,200 V 176" fill="none" stroke="#9ca8b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#document-lifecycle-dark-arrow-muted)"/>
<rect x="100" y="198" width="40" height="12" rx="2" fill="#10141a"/><text x="120" y="207" class="a" text-anchor="middle" fill="#9ca8b8">CANCEL</text><rect x="404" y="198" width="36" height="12" rx="2" fill="#10141a"/><text x="422" y="207" class="a" text-anchor="middle" fill="#9ca8b8">FAILS</text><rect x="658" y="54" width="84" height="12" rx="2" fill="#10141a"/><text x="700" y="63" class="a" text-anchor="middle" fill="#9ca8b8">RETENTION ENDS</text><rect x="594" y="214" width="84" height="12" rx="2" fill="#10141a"/><text x="636" y="223" class="a" text-anchor="middle" fill="#9ca8b8">KEEP THE FILES</text>
<rect x="32" y="120" width="120" height="56" rx="6" fill="#10141a"/><rect x="32" y="120" width="120" height="56" rx="6" fill="rgba(229,233,239,0.02)" stroke="#9ca8b8" stroke-width="1" stroke-dasharray="4,3"/><text x="92.0" y="146.0" class="n" text-anchor="middle" fill="#e5e9ef">Held</text><text x="92.0" y="160.0" class="s" text-anchor="middle" fill="#9ca8b8">confirm to send</text>
<rect x="184" y="120" width="120" height="56" rx="6" fill="#10141a"/><rect x="184" y="120" width="120" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="244.0" y="146.0" class="n" text-anchor="middle" fill="#e5e9ef">Waiting</text><text x="244.0" y="160.0" class="s" text-anchor="middle" fill="#9ca8b8">in the queue</text>
<rect x="336" y="120" width="120" height="56" rx="6" fill="#10141a"/><rect x="336" y="120" width="120" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="396.0" y="146.0" class="n" text-anchor="middle" fill="#e5e9ef">Processing</text><text x="396.0" y="160.0" class="s" text-anchor="middle" fill="#9ca8b8">usually a minute</text>
<rect x="488" y="120" width="120" height="56" rx="6" fill="#10141a"/><rect x="488" y="120" width="120" height="56" rx="6" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="548.0" y="146.0" class="n" text-anchor="middle" fill="#e5e9ef">Done</text><text x="548.0" y="160.0" class="s" text-anchor="middle" fill="#9ca8b8">ready to download</text>
<rect x="640" y="120" width="120" height="56" rx="6" fill="#10141a"/><rect x="640" y="120" width="120" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="700.0" y="146.0" class="n" text-anchor="middle" fill="#e5e9ef">Marked done</text><text x="700.0" y="160.0" class="s" text-anchor="middle" fill="#9ca8b8">24 h to undo</text>
<rect x="792" y="120" width="120" height="56" rx="6" fill="#10141a"/><rect x="792" y="120" width="120" height="56" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="852.0" y="146.0" class="n" text-anchor="middle" fill="#e5e9ef">Removed</text><text x="852.0" y="160.0" class="s" text-anchor="middle" fill="#9ca8b8">files gone</text>
<rect x="32" y="232" width="120" height="56" rx="6" fill="#10141a"/><rect x="32" y="232" width="120" height="56" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="92.0" y="258.0" class="n" text-anchor="middle" fill="#e5e9ef">Canceled</text><text x="92.0" y="272.0" class="s" text-anchor="middle" fill="#9ca8b8">nothing used</text>
<rect x="336" y="232" width="120" height="56" rx="6" fill="#10141a"/><rect x="336" y="232" width="120" height="56" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="396.0" y="258.0" class="n" text-anchor="middle" fill="#e5e9ef">Failed</text><text x="396.0" y="272.0" class="s" text-anchor="middle" fill="#9ca8b8">pages given back</text>
<text x="32" y="320" class="p" style="font-size:11px" text-anchor="start" fill="#9ca8b8">Held only with an option that asks before sending. Scripts see these as held, queued, processing, completed, failed and canceled.</text>
<line x1="16" y1="336" x2="944" y2="336" stroke="rgba(229,233,239,0.12)" stroke-width="0.8"/><text x="16" y="356" class="e" fill="#9ca8b8">LEGEND</text><rect x="88" y="348" width="16" height="10" rx="2" fill="rgba(229,233,239,0.02)" stroke="#9ca8b8" stroke-width="1" stroke-dasharray="4,3"/><text x="110" y="356" class="p" fill="#9ca8b8">Only for options that ask</text><rect x="284.0" y="348" width="16" height="10" rx="2" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="306.0" y="356" class="p" fill="#9ca8b8">On its way</text><rect x="390.0" y="348" width="16" height="10" rx="2" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="412.0" y="356" class="p" fill="#9ca8b8">Your results</text><rect x="508.0" y="348" width="16" height="10" rx="2" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="530.0" y="356" class="p" fill="#9ca8b8">The end</text>
</svg>
