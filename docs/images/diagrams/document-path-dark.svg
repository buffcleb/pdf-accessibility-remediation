<rect x="95" y="91" width="194" height="13" fill="#10141a"/><text x="192" y="101" class="p" text-anchor="middle" fill="#9ca8b8">upload: service, AI level, kind</text><rect x="320" y="138" width="206" height="13" fill="#10141a"/><text x="324" y="148" class="p" text-anchor="start" fill="#9ca8b8">access checks; pages counted in a</text><rect x="320" y="151" width="254" height="13" fill="#10141a"/><text x="324" y="161" class="p" text-anchor="start" fill="#9ca8b8">limited child process; per-document limit</text><rect x="122" y="193" width="140" height="13" fill="#14181e"/><text x="192" y="203" class="p" text-anchor="middle" fill="#9ca8b8">held: nothing reserved</text><rect x="167" y="229" width="50" height="13" fill="#14181e"/><text x="192" y="239" class="p" text-anchor="middle" fill="#9ca8b8">confirm</text><rect x="320" y="296" width="194" height="13" fill="#10141a"/><text x="324" y="306" class="p" text-anchor="start" fill="#9ca8b8">reserve pages (ledger: reserve)</text><rect x="512" y="336" width="224" height="13" fill="#10141a"/><text x="516" y="346" class="p" text-anchor="start" fill="#9ca8b8">queue order: per-person limit, large</text><rect x="512" y="349" width="224" height="13" fill="#10141a"/><text x="516" y="359" class="p" text-anchor="start" fill="#9ca8b8">documents, daily caps, paused queues</text><rect x="479" y="391" width="194" height="13" fill="#14181e"/><text x="576" y="401" class="p" text-anchor="middle" fill="#9ca8b8">classify: the first pages&#x27; text</text><rect x="449" y="447" width="254" height="13" fill="#10141a"/><text x="576" y="457" class="p" text-anchor="middle" fill="#9ca8b8">submit, with the level&#x27;s or kind&#x27;s models</text><rect x="659" y="483" width="218" height="13" fill="#10141a"/><text x="768" y="493" class="p" text-anchor="middle" fill="#9ca8b8">AI calls, tagged with job and level</text><rect x="695" y="519" width="146" height="13" fill="#10141a"/><text x="768" y="529" class="p" text-anchor="middle" fill="#9ca8b8">answers + cost per call</text><rect x="494" y="555" width="164" height="13" fill="#10141a"/><text x="576" y="565" class="p" text-anchor="middle" fill="#9ca8b8">poll, then fetch the files</text><rect x="512" y="602" width="218" height="13" fill="#10141a"/><text x="516" y="612" class="p" text-anchor="start" fill="#9ca8b8">store versions and AI cost; ledger:</text><rect x="512" y="615" width="182" height="13" fill="#10141a"/><text x="516" y="625" class="p" text-anchor="start" fill="#9ca8b8">commit, or release on failure</text><rect x="173" y="641" width="230" height="13" fill="#10141a"/><text x="288" y="651" class="p" text-anchor="middle" fill="#9ca8b8">email: at once, or in a daily summary</text>
