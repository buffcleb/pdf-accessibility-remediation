<svg viewBox="0 0 960 702" width="960" height="702" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="document-path-dark-title document-path-dark-desc">
<title id="document-path-dark-title">One document&#x27;s path</title>
<desc id="document-path-dark-desc">A person uploads with a processing service, AI level and kind; the portal checks access and counts pages in a limited child process, holds the document if the service asks for confirmation or the PDF is signed, then reserves pages; the worker orders the queue, optionally has the engine classify the document, and submits it; the engine&#x27;s AI calls go through the gateway, which returns answers and costs; the worker polls, fetches the files, stores the versions, commits or releases the pages, and emails the person.</desc>
<defs><marker id="document-path-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="document-path-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="document-path-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
