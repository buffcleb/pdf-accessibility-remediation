<svg viewBox="0 0 960 392" width="960" height="392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engine-nodes-dark-title engine-nodes-dark-desc">
<title id="engine-nodes-dark-title">The PDF engine on nodes of its own</title>
<desc id="engine-nodes-dark-desc">With ENGINE_NODES set, the pods that open uploaded documents run only on labelled, tainted agent nodes, and the portal, data, shared services and the cluster&#x27;s control plane stay on the three server nodes.</desc>
<defs><marker id="engine-nodes-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="engine-nodes-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="engine-nodes-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>
<rect x="24" y="40" width="424" height="288" rx="8" fill="rgba(229,233,239,0.02)" stroke="rgba(229,233,239,0.14)" stroke-width="0.8"/><rect x="36" y="34" width="205" height="12" rx="2" fill="#10141a"/><text x="40" y="43" class="e" fill="#9ca8b8">SERVER NODES · CONTROL PLANE AND ETCD</text><rect x="512" y="40" width="424" height="288" rx="8" fill="rgba(134,180,238,0.05)" stroke="rgba(134,180,238,0.6)" stroke-width="0.8" stroke-dasharray="4,4"/><rect x="524" y="34" width="141" height="12" rx="2" fill="#10141a"/><text x="528" y="43" class="e" fill="#9ca8b8">ENGINE NODES · AGENT ONLY</text><rect x="48" y="72" width="376" height="232" rx="6" fill="#10141a"/><rect x="48" y="72" width="376" height="232" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><rect x="60" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(229,233,239,0.3)" stroke-width="0.8"/><text x="72.0" y="93" class="t" text-anchor="middle" fill="#9ca8b8">VM</text><text x="92" y="94" class="n" text-anchor="start" fill="#e5e9ef">server node</text><rect x="388" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(229,233,239,0.3)" stroke-width="0.8"/><text x="400.0" y="93" class="b" text-anchor="middle" fill="#9ca8b8">×3</text><rect x="536" y="72" width="376" height="232" rx="6" fill="#10141a"/><rect x="536" y="72" width="376" height="232" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><rect x="548" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(229,233,239,0.3)" stroke-width="0.8"/><text x="560.0" y="93" class="t" text-anchor="middle" fill="#9ca8b8">VM</text><text x="580" y="94" class="n" text-anchor="start" fill="#e5e9ef">engine node</text><rect x="876" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(229,233,239,0.3)" stroke-width="0.8"/><text x="888.0" y="93" class="b" text-anchor="middle" fill="#9ca8b8">×2</text><text x="548" y="292" class="s" text-anchor="start" fill="#9ca8b8">label + taint pdfrem/role=engine:NoSchedule</text>
<path d="M 408,140 H 552" fill="none" stroke="#5cc6cc" stroke-width="1.2" marker-end="url(#engine-nodes-dark-arrow-link)"/>
<rect x="454" y="120" width="56" height="12" rx="2" fill="#10141a"/><text x="482" y="129" class="a" text-anchor="middle" fill="#5cc6cc">DOCUMENTS</text>
