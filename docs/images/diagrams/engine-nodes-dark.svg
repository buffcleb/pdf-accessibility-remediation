<rect x="64" y="224" width="344" height="24" rx="4" fill="#10141a"/><rect x="64" y="224" width="344" height="24" rx="4" fill="#171d25" stroke="#e5e9ef" stroke-width="0.8"/><text x="72" y="240" class="c" fill="#e5e9ef">litellm · verapdf · monitoring</text><text x="400" y="240" class="s" text-anchor="end" fill="#9ca8b8">shared</text>
<rect x="552" y="128" width="344" height="24" rx="4" fill="#10141a"/><rect x="552" y="128" width="344" height="24" rx="4" fill="#171d25" stroke="#e5e9ef" stroke-width="0.8"/><text x="560" y="144" class="c" fill="#e5e9ef">engine-api · scheduler</text><text x="888" y="144" class="s" text-anchor="end" fill="#9ca8b8">takes PDFs in</text>
<rect x="552" y="160" width="344" height="24" rx="4" fill="#10141a"/><rect x="552" y="160" width="344" height="24" rx="4" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="0.8"/><text x="560" y="176" class="c" fill="#e5e9ef">engine-worker</text><text x="888" y="176" class="s" text-anchor="end" fill="#86b4ee">1 to ENGINE_WORKERS_MAX</text>
<rect x="552" y="192" width="344" height="24" rx="4" fill="#10141a"/><rect x="552" y="192" width="344" height="24" rx="4" fill="#171d25" stroke="#e5e9ef" stroke-width="0.8"/><text x="560" y="208" class="c" fill="#e5e9ef">adobe-worker</text><text x="888" y="208" class="s" text-anchor="end" fill="#9ca8b8">if Adobe is on</text>
<rect x="552" y="224" width="344" height="24" rx="4" fill="#10141a"/><rect x="552" y="224" width="344" height="24" rx="4" fill="#171d25" stroke="#e5e9ef" stroke-width="0.8"/><text x="560" y="240" class="c" fill="#e5e9ef">music · formula readers</text><text x="888" y="240" class="s" text-anchor="end" fill="#9ca8b8">on demand</text>
<line x1="16" y1="344" x2="944" y2="344" stroke="rgba(229,233,239,0.12)" stroke-width="0.8"/><text x="16" y="364" class="e" fill="#9ca8b8">LEGEND</text><rect x="88" y="356" width="16" height="10" rx="2" fill="rgba(134,180,238,0.05)" stroke="rgba(134,180,238,0.6)" stroke-width="1" stroke-dasharray="4,4"/><text x="110" y="364" class="p" fill="#9ca8b8">Only the engine&#x27;s pods may run here</text><rect x="344.0" y="356" width="16" height="10" rx="2" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="366.0" y="364" class="p" fill="#9ca8b8">Pods</text><rect x="414.0" y="356" width="16" height="10" rx="2" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="436.0" y="364" class="p" fill="#9ca8b8">Opens uploaded documents</text><line x1="604.0" y1="361" x2="628.0" y2="361" stroke="#5cc6cc" stroke-width="1.2" marker-end="url(#engine-nodes-dark-arrow-link)"/><text x="636.0" y="364" class="p" fill="#9ca8b8">Between nodes</text>
</svg>
