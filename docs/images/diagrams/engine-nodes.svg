<svg viewBox="0 0 960 392" width="960" height="392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engine-nodes-title engine-nodes-desc">
<title id="engine-nodes-title">The PDF engine on nodes of its own</title>
<desc id="engine-nodes-desc">With ENGINE_NODES set, the pods that open uploaded documents run only on labelled, tainted agent nodes, and the portal, data, shared services and the cluster&#x27;s control plane stay on the three server nodes.</desc>
<defs><marker id="engine-nodes-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="engine-nodes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="engine-nodes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>
<rect x="24" y="40" width="424" height="288" rx="8" fill="rgba(23,32,48,0.02)" stroke="rgba(23,32,48,0.14)" stroke-width="0.8"/><rect x="36" y="34" width="205" height="12" rx="2" fill="#f5f7fa"/><text x="40" y="43" class="e" fill="#536074">SERVER NODES · CONTROL PLANE AND ETCD</text><rect x="512" y="40" width="424" height="288" rx="8" fill="rgba(31,78,140,0.05)" stroke="rgba(31,78,140,0.6)" stroke-width="0.8" stroke-dasharray="4,4"/><rect x="524" y="34" width="141" height="12" rx="2" fill="#f5f7fa"/><text x="528" y="43" class="e" fill="#536074">ENGINE NODES · AGENT ONLY</text><rect x="48" y="72" width="376" height="232" rx="6" fill="#f5f7fa"/><rect x="48" y="72" width="376" height="232" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="60" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="72.0" y="93" class="t" text-anchor="middle" fill="#536074">VM</text><text x="92" y="94" class="n" text-anchor="start" fill="#172030">server node</text><rect x="388" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="400.0" y="93" class="b" text-anchor="middle" fill="#536074">×3</text><rect x="536" y="72" width="376" height="232" rx="6" fill="#f5f7fa"/><rect x="536" y="72" width="376" height="232" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="548" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="560.0" y="93" class="t" text-anchor="middle" fill="#536074">VM</text><text x="580" y="94" class="n" text-anchor="start" fill="#172030">engine node</text><rect x="876" y="84" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="888.0" y="93" class="b" text-anchor="middle" fill="#536074">×2</text><text x="548" y="292" class="s" text-anchor="start" fill="#536074">label + taint pdfrem/role=engine:NoSchedule</text>
<path d="M 408,140 H 552" fill="none" stroke="#0f6e74" stroke-width="1.2" marker-end="url(#engine-nodes-arrow-link)"/>
<rect x="454" y="120" width="56" height="12" rx="2" fill="#f5f7fa"/><text x="482" y="129" class="a" text-anchor="middle" fill="#0f6e74">DOCUMENTS</text>
<rect x="64" y="128" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="64" y="128" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="72" y="144" class="c" fill="#172030">web · portal-api · portal-worker</text><text x="400" y="144" class="s" text-anchor="end" fill="#536074">portal</text>
<rect x="64" y="160" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="64" y="160" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="72" y="176" class="c" fill="#172030">control plane · etcd</text><text x="400" y="176" class="s" text-anchor="end" fill="#536074">RKE2 server</text>
<rect x="64" y="192" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="64" y="192" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="72" y="208" class="c" fill="#172030">postgres · redis · seaweedfs</text><text x="400" y="208" class="s" text-anchor="end" fill="#536074">data</text>
<rect x="64" y="224" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="64" y="224" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="72" y="240" class="c" fill="#172030">litellm · verapdf · monitoring</text><text x="400" y="240" class="s" text-anchor="end" fill="#536074">shared</text>
<rect x="552" y="128" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="552" y="128" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="560" y="144" class="c" fill="#172030">engine-api · scheduler</text><text x="888" y="144" class="s" text-anchor="end" fill="#536074">takes PDFs in</text>
<rect x="552" y="160" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="552" y="160" width="344" height="24" rx="4" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="0.8"/><text x="560" y="176" class="c" fill="#172030">engine-worker</text><text x="888" y="176" class="s" text-anchor="end" fill="#1f4e8c">1 to ENGINE_WORKERS_MAX</text>
<rect x="552" y="192" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="552" y="192" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="560" y="208" class="c" fill="#172030">adobe-worker</text><text x="888" y="208" class="s" text-anchor="end" fill="#536074">if Adobe is on</text>
<rect x="552" y="224" width="344" height="24" rx="4" fill="#f5f7fa"/><rect x="552" y="224" width="344" height="24" rx="4" fill="#ffffff" stroke="#172030" stroke-width="0.8"/><text x="560" y="240" class="c" fill="#172030">music · formula readers</text><text x="888" y="240" class="s" text-anchor="end" fill="#536074">on demand</text>
<line x1="16" y1="344" x2="944" y2="344" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="16" y="364" class="e" fill="#536074">LEGEND</text><rect x="88" y="356" width="16" height="10" rx="2" fill="rgba(31,78,140,0.05)" stroke="rgba(31,78,140,0.6)" stroke-width="1" stroke-dasharray="4,4"/><text x="110" y="364" class="p" fill="#536074">Only the engine&#x27;s pods may run here</text><rect x="344.0" y="356" width="16" height="10" rx="2" fill="#ffffff" stroke="#172030" stroke-width="1"/><text x="366.0" y="364" class="p" fill="#536074">Pods</text><rect x="414.0" y="356" width="16" height="10" rx="2" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="436.0" y="364" class="p" fill="#536074">Opens uploaded documents</text><line x1="604.0" y1="361" x2="628.0" y2="361" stroke="#0f6e74" stroke-width="1.2" marker-end="url(#engine-nodes-arrow-link)"/><text x="636.0" y="364" class="p" fill="#536074">Between nodes</text>
</svg>
