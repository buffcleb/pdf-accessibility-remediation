<svg viewBox="0 0 960 952" width="960" height="952" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engine-pipeline-dark-title engine-pipeline-dark-desc">
<title id="engine-pipeline-dark-title">The engine&#x27;s pipeline</title>
<desc id="engine-pipeline-dark-desc">Each document is validated, has its font maps fixed and its layout analyzed; scanned pages get an OCR text layer; the AI adds alt text, tables, reading order and notation; it is tagged without changing how it looks and validated, with a modified file only if fonts still fail; every output is verified, and an integrity failure fails the job; otherwise the reports are written.</desc>
<defs><marker id="engine-pipeline-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="engine-pipeline-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="engine-pipeline-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>

