<rect x="536" y="300" width="360" height="56" rx="6" fill="#10141a"/><rect x="536" y="300" width="360" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="716.0" y="326.0" class="n" text-anchor="middle" fill="#e5e9ef">OCR: an invisible text layer</text><text x="716.0" y="340.0" class="s" text-anchor="middle" fill="#9ca8b8">AI fixes unsure words; figures found in the scan</text>
