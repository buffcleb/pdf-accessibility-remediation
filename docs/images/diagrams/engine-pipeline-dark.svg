<rect x="248" y="366" width="20" height="12" rx="2" fill="#10141a"/><text x="258" y="375" class="a" text-anchor="middle" fill="#9ca8b8">NO</text><rect x="248" y="670" width="20" height="12" rx="2" fill="#10141a"/><text x="258" y="679" class="a" text-anchor="middle" fill="#9ca8b8">NO</text><rect x="248" y="830" width="24" height="12" rx="2" fill="#10141a"/><text x="260" y="839" class="a" text-anchor="middle" fill="#9ca8b8">YES</text><rect x="416" y="308" width="24" height="12" rx="2" fill="#10141a"/><text x="428" y="317" class="a" text-anchor="middle" fill="#9ca8b8">YES</text><rect x="416" y="612" width="24" height="12" rx="2" fill="#10141a"/><text x="428" y="621" class="a" text-anchor="middle" fill="#9ca8b8">YES</text><rect x="418" y="772" width="20" height="12" rx="2" fill="#10141a"/><text x="428" y="781" class="a" text-anchor="middle" fill="#86b4ee">NO</text>
<rect x="140" y="16" width="200" height="40" rx="20" fill="#10141a"/><rect x="140" y="16" width="200" height="40" rx="20" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="40.0" class="n" text-anchor="middle" fill="#e5e9ef">Upload</text>
<rect x="40" y="80" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="80" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="102.0" class="n" text-anchor="middle" fill="#e5e9ef">1. Validate the original</text><text x="240.0" y="116.0" class="s" text-anchor="middle" fill="#9ca8b8">veraPDF and the audit: the &#x27;before&#x27;</text>
<rect x="40" y="152" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="152" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="174.0" class="n" text-anchor="middle" fill="#e5e9ef">2. Fix font Unicode maps</text><text x="240.0" y="188.0" class="s" text-anchor="middle" fill="#9ca8b8">no visual change</text>
<rect x="40" y="224" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="224" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="246.0" class="n" text-anchor="middle" fill="#e5e9ef">3. Analyze the layout</text><text x="240.0" y="260.0" class="s" text-anchor="middle" fill="#9ca8b8">text, headings, lists, tables, images, columns</text>
<rect x="40" y="384" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="384" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="406.0" class="n" text-anchor="middle" fill="#e5e9ef">4. AI enrichment, through the gateway</text><text x="240.0" y="420.0" class="s" text-anchor="middle" fill="#9ca8b8">alt text, tables, reading order, notation</text>
<rect x="40" y="456" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="456" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="478.0" class="n" text-anchor="middle" fill="#e5e9ef">5. Tag, non-destructively</text><text x="240.0" y="492.0" class="s" text-anchor="middle" fill="#9ca8b8">nested lists, heading levels, read-aloud math</text>
<rect x="40" y="528" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="528" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="550.0" class="n" text-anchor="middle" fill="#e5e9ef">6. Validate, fix glyph widths</text><text x="240.0" y="564.0" class="s" text-anchor="middle" fill="#9ca8b8">only if the pages stay pixel-identical</text>
<rect x="40" y="688" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="688" width="400" height="48" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240.0" y="710.0" class="n" text-anchor="middle" fill="#e5e9ef">8. Verify every output</text><text x="240.0" y="724.0" class="s" text-anchor="middle" fill="#9ca8b8">integrity, semantics, AI review, the tag map</text>
<rect x="40" y="848" width="400" height="48" rx="6" fill="#10141a"/><rect x="40" y="848" width="400" height="48" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="240.0" y="870.0" class="n" text-anchor="middle" fill="#e5e9ef">9. Reports</text><text x="240.0" y="884.0" class="s" text-anchor="middle" fill="#9ca8b8">before and after, the review list; Markdown, JSON, PDF</text>
<polygon points="240,296.0 320.0,328 240,360.0 160.0,328" fill="#10141a"/><polygon points="240,296.0 320.0,328 240,360.0 160.0,328" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="240" y="325" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">Scanned</text><text x="240" y="339" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">pages?</text>
