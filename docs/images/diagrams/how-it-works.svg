<svg viewBox="0 0 960 408" width="960" height="408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
<title id="how-it-works-title">How it works</title>
<desc id="how-it-works-desc">People use the portal in a browser; the portal keeps records and files and sends documents to the engine, which checks them with veraPDF and Tesseract and makes its AI calls through the AI gateway to local models, or to cloud models and Adobe PDF Services when those are turned on.</desc>
