<svg viewBox="0 0 960 456" width="960" height="456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="install-order-title install-order-desc">
<title id="install-order-title">Who does what, in order</title>
<desc id="install-order-desc">The nine install steps by team: all teams decide the install values; network and storage then work in parallel; the OS team builds the servers once the network is ready; the middleware team installs the cluster, adds the add-ons once storage is ready too, and deploys; all teams work through the checklists; the middleware and OS teams rehearse a restore and a node going down.</desc>
<defs><marker id="install-order-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="install-order-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="install-order-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>
<rect x="16" y="24" width="928" height="72" fill="rgba(23,32,48,0.025)"/><line x1="16" y1="96" x2="944" y2="96" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="24" y="63.0" class="e" fill="#536074">ALL TEAMS</text><rect x="16" y="96" width="928" height="72" fill="none"/><line x1="16" y1="168" x2="944" y2="168" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="24" y="135.0" class="e" fill="#536074">NETWORK</text><rect x="16" y="168" width="928" height="72" fill="rgba(23,32,48,0.025)"/><line x1="16" y1="240" x2="944" y2="240" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="24" y="207.0" class="e" fill="#536074">STORAGE</text><rect x="16" y="240" width="928" height="72" fill="none"/><line x1="16" y1="312" x2="944" y2="312" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="24" y="279.0" class="e" fill="#536074">OS</text><rect x="16" y="312" width="928" height="72" fill="rgba(23,32,48,0.025)"/><line x1="16" y1="384" x2="944" y2="384" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="24" y="351.0" class="e" fill="#536074">MIDDLEWARE</text>
