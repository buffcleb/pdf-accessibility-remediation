<rect x="228" y="104" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="228" y="104" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="236" y="110" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="248.0" y="119" class="t" text-anchor="middle" fill="#536074">02</text><text x="268.0" y="139" class="n" text-anchor="middle" fill="#172030">Network</text><text x="268.0" y="152" class="s" text-anchor="middle" fill="#536074">1–2 days</text>
<rect x="228" y="176" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="228" y="176" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="236" y="182" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="248.0" y="191" class="t" text-anchor="middle" fill="#536074">03</text><text x="268.0" y="211" class="n" text-anchor="middle" fill="#172030">Storage</text><text x="268.0" y="224" class="s" text-anchor="middle" fill="#536074">varies</text>
<rect x="328" y="248" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="328" y="248" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="336" y="254" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="348.0" y="263" class="t" text-anchor="middle" fill="#536074">04</text><text x="368.0" y="283" class="n" text-anchor="middle" fill="#172030">Servers</text><text x="368.0" y="296" class="s" text-anchor="middle" fill="#536074">1 day</text>
<rect x="428" y="320" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="428" y="320" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="436" y="326" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="448.0" y="335" class="t" text-anchor="middle" fill="#536074">05</text><text x="468.0" y="355" class="n" text-anchor="middle" fill="#172030">Cluster</text><text x="468.0" y="368" class="s" text-anchor="middle" fill="#536074">½ day</text>
<rect x="528" y="320" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="528" y="320" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="536" y="326" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="548.0" y="335" class="t" text-anchor="middle" fill="#536074">06</text><text x="568.0" y="355" class="n" text-anchor="middle" fill="#172030">Add-ons</text><text x="568.0" y="368" class="s" text-anchor="middle" fill="#536074">1 day</text>
<rect x="628" y="320" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="628" y="320" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="636" y="326" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="648.0" y="335" class="t" text-anchor="middle" fill="#536074">07</text><text x="668.0" y="355" class="n" text-anchor="middle" fill="#172030">Deploy</text><text x="668.0" y="368" class="s" text-anchor="middle" fill="#536074">½ day</text>
<rect x="728" y="32" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="728" y="32" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="736" y="38" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="748.0" y="47" class="t" text-anchor="middle" fill="#536074">08</text><text x="768.0" y="67" class="n" text-anchor="middle" fill="#172030">Sign off</text><text x="768.0" y="80" class="s" text-anchor="middle" fill="#536074">checklists</text>
<rect x="828" y="320" width="80" height="56" rx="6" fill="#f5f7fa"/><rect x="828" y="320" width="80" height="56" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="836" y="326" width="24" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="848.0" y="335" class="t" text-anchor="middle" fill="#536074">09</text><text x="868.0" y="355" class="n" text-anchor="middle" fill="#172030">Rehearse</text><text x="868.0" y="368" class="s" text-anchor="middle" fill="#536074">½ day</text>
<text x="128" y="412" class="p" style="font-size:11px" text-anchor="start" fill="#536074">Order runs left to right. Add-ons wait for both the cluster and storage; Rehearse is with the OS team.</text>
<line x1="16" y1="424" x2="944" y2="424" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="16" y="444" class="e" fill="#536074">LEGEND</text><rect x="88" y="436" width="16" height="10" rx="2" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="110" y="444" class="p" fill="#536074">Decide at install: can&#x27;t change later</text><rect x="356.0" y="436" width="16" height="10" rx="2" fill="#ffffff" stroke="#172030" stroke-width="1"/><text x="378.0" y="444" class="p" fill="#536074">A step</text><line x1="438.0" y1="441" x2="462.0" y2="441" stroke="#536074" stroke-width="1.2" marker-end="url(#install-order-arrow-muted)"/><text x="470.0" y="444" class="p" fill="#536074">Needs the step before</text>
</svg>
