<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-paths-title network-paths-desc">
<title id="network-paths-title">Ways in and out of the cluster</title>
<desc id="network-paths-desc">People reach the service address on port 443 and administrators reach the API address on 6443 and the nodes on SSH, each address landing on any node; the cluster ports run between the three nodes only; outbound, the nodes reach DNS, NTP and package and image registries, the service reaches its allowed hosts only through the egress proxy, and the portal reaches the mail relay directly.</desc>
