<svg viewBox="0 0 960 288" width="960" height="288" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="patching-cycle-title patching-cycle-desc">
<title id="patching-cycle-title">Patching one server at a time</title>
<desc id="patching-cycle-desc">Each server in turn: drained so its pods move to the other two and documents being remediated finish, patched and rebooted, back as Ready but not scheduling, then uncordoned before the next server.</desc>
<defs><marker id="patching-cycle-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="patching-cycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="patching-cycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>

<path d="M 200,104 H 280" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#patching-cycle-arrow-muted)"/>
<path d="M 432,104 H 512" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#patching-cycle-arrow-muted)"/>
<path d="M 664,104 H 744" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#patching-cycle-arrow-muted)"/>
<path d="M 820,136 V 192 Q 820,200 812,200 H 132 Q 124,200 124,192 V 136" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#patching-cycle-arrow-muted)"/>
<rect x="222" y="84" width="36" height="12" rx="2" fill="#f5f7fa"/><text x="240" y="93" class="a" text-anchor="middle" fill="#536074">DRAIN</text><rect x="448" y="84" width="48" height="12" rx="2" fill="#f5f7fa"/><text x="472" y="93" class="a" text-anchor="middle" fill="#536074">DRAINED</text><rect x="678" y="84" width="52" height="12" rx="2" fill="#f5f7fa"/><text x="704" y="93" class="a" text-anchor="middle" fill="#536074">REBOOTED</text><rect x="446" y="180" width="52" height="12" rx="2" fill="#f5f7fa"/><text x="472" y="189" class="a" text-anchor="middle" fill="#536074">UNCORDON</text>
<rect x="48" y="72" width="152" height="64" rx="6" fill="#f5f7fa"/><rect x="48" y="72" width="152" height="64" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><text x="124.0" y="102.0" class="n" text-anchor="middle" fill="#172030">Ready</text><text x="124.0" y="116.0" class="s" text-anchor="middle" fill="#536074">running its pods</text>
<rect x="280" y="72" width="152" height="64" rx="6" fill="#f5f7fa"/><rect x="280" y="72" width="152" height="64" rx="6" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="356.0" y="102.0" class="n" text-anchor="middle" fill="#172030">Draining</text><text x="356.0" y="116.0" class="s" text-anchor="middle" fill="#536074">pods move to the others</text>
<rect x="512" y="72" width="152" height="64" rx="6" fill="#f5f7fa"/><rect x="512" y="72" width="152" height="64" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><text x="588.0" y="102.0" class="n" text-anchor="middle" fill="#172030">Patching</text><text x="588.0" y="116.0" class="s" text-anchor="middle" fill="#536074">patch · reboot</text>
<rect x="744" y="72" width="152" height="64" rx="6" fill="#f5f7fa"/><rect x="744" y="72" width="152" height="64" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><text x="820.0" y="102.0" class="n" text-anchor="middle" fill="#172030">Back, cordoned</text><text x="820.0" y="116.0" class="s" text-anchor="middle" fill="#536074">SchedulingDisabled</text>
<text x="472" y="240" class="p" style="font-size:11px" text-anchor="middle" fill="#536074">Then the next server, once every pod in pdf-remediation shows Running.</text>
<text x="472" y="256" class="p" style="font-size:11px" text-anchor="middle" fill="#536074">With the drain-on-shutdown service installed, the drain and uncordon happen on their own at reboot.</text>

</svg>
