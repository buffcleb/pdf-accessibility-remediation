<svg viewBox="0 0 960 472" width="960" height="472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="portal-architecture-dark-title portal-architecture-dark-desc">
<title id="portal-architecture-dark-title">The portal as built</title>
<desc id="portal-architecture-dark-desc">The browser&#x27;s React app reaches nginx, which serves the app and passes /api to the portal API; the API uses PostgreSQL, a Redis for rate limits, an S3 object store and mail, with SAML sign-in designed but on hold; the portal worker shares the database and store and submits documents to the engine over internal HTTP with an API key; the engine makes all AI calls through the AI gateway.</desc>
