<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reference-rke2-dark-title reference-rke2-dark-desc">
<title id="reference-rke2-dark-title">The reference deployment</title>
<desc id="reference-rke2-dark-desc">People reach Cloudflare&#x27;s edge, which passes traffic through an outbound-only tunnel to cloudflared in a three-node RKE2 cluster; the portal and engine run there with their data on the NAS, block storage over iSCSI and a shared NFS folder; the AI gateway reaches a GPU server on the LAN and, for opt-in levels, OpenRouter; mail goes out through Cloudflare&#x27;s email service, and images come from GHCR.</desc>
