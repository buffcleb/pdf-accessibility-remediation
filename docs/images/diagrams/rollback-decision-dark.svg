<path d="M 864,96 V 284 Q 864,292 856,292 H 472 Q 464,292 464,284 V 216" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#rollback-decision-dark-arrow-muted)"/>
<rect x="370" y="48" width="20" height="12" rx="2" fill="#10141a"/><text x="380" y="57" class="a" text-anchor="middle" fill="#9ca8b8">NO</text><rect x="568" y="48" width="24" height="12" rx="2" fill="#10141a"/><text x="580" y="57" class="a" text-anchor="middle" fill="#9ca8b8">YES</text><rect x="754" y="48" width="24" height="12" rx="2" fill="#10141a"/><text x="766" y="57" class="a" text-anchor="middle" fill="#9ca8b8">YES</text><rect x="288" y="128" width="24" height="12" rx="2" fill="#10141a"/><text x="300" y="137" class="a" text-anchor="middle" fill="#9ca8b8">YES</text><rect x="488" y="128" width="20" height="12" rx="2" fill="#10141a"/><text x="498" y="137" class="a" text-anchor="middle" fill="#9ca8b8">NO</text><rect x="688" y="128" width="20" height="12" rx="2" fill="#10141a"/><text x="698" y="137" class="a" text-anchor="middle" fill="#9ca8b8">NO</text>
<rect x="16" y="40" width="160" height="56" rx="28" fill="#10141a"/><rect x="16" y="40" width="160" height="56" rx="28" fill="rgba(156,168,184,0.1)" stroke="#9ca8b8" stroke-width="1"/><text x="96.0" y="66.0" class="n" text-anchor="middle" fill="#e5e9ef">A release breaks</text><text x="96.0" y="80.0" class="s" text-anchor="middle" fill="#9ca8b8">decide quickly</text>
<polygon points="280,28.0 348.0,68 280,108.0 212.0,68" fill="#10141a"/><polygon points="280,28.0 348.0,68 280,108.0 212.0,68" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="280" y="65" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">Small, clear</text><text x="280" y="79" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">fix?</text>
<polygon points="480,28.0 548.0,68 480,108.0 412.0,68" fill="#10141a"/><polygon points="480,28.0 548.0,68 480,108.0 412.0,68" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="480" y="65" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">A migration in</text><text x="480" y="79" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">the release?</text>
<polygon points="680,28.0 748.0,68 680,108.0 612.0,68" fill="#10141a"/><polygon points="680,28.0 748.0,68 680,108.0 612.0,68" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="680" y="65" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">Downgrade</text><text x="680" y="79" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">safe?</text>
<rect x="784" y="40" width="160" height="56" rx="6" fill="#10141a"/><rect x="784" y="40" width="160" height="56" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="864.0" y="66.0" class="n" text-anchor="middle" fill="#e5e9ef">Downgrade</text><text x="864.0" y="80.0" class="s" text-anchor="middle" fill="#9ca8b8">deploy.sh downgrade</text>
<rect x="208" y="160" width="144" height="56" rx="6" fill="#10141a"/><rect x="208" y="160" width="144" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="280.0" y="186.0" class="n" text-anchor="middle" fill="#e5e9ef">Fix forward</text><text x="280.0" y="200.0" class="s" text-anchor="middle" fill="#9ca8b8">build and deploy</text>
<rect x="392" y="160" width="176" height="56" rx="6" fill="#10141a"/><rect x="392" y="160" width="176" height="56" rx="6" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="480.0" y="186.0" class="n" text-anchor="middle" fill="#e5e9ef">The earlier release</text><text x="480.0" y="200.0" class="s" text-anchor="middle" fill="#9ca8b8">§3, then check (§6)</text>
<rect x="600" y="160" width="160" height="56" rx="6" fill="#10141a"/><rect x="600" y="160" width="160" height="56" rx="6" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="680.0" y="186.0" class="n" text-anchor="middle" fill="#e5e9ef">Restore</text><text x="680.0" y="200.0" class="s" text-anchor="middle" fill="#9ca8b8">restore.sh the backup</text>
<text x="16" y="332" class="p" style="font-size:11px" text-anchor="start" fill="#9ca8b8">A downgrade loses what the undone migrations added; a restore loses everything since the backup deploy.sh made before migrating.</text>
<line x1="16" y1="352" x2="944" y2="352" stroke="rgba(229,233,239,0.12)" stroke-width="0.8"/><text x="16" y="372" class="e" fill="#9ca8b8">LEGEND</text><rect x="88" y="364" width="16" height="10" rx="2" fill="rgba(156,168,184,0.1)" stroke="#9ca8b8" stroke-width="1"/><text x="110" y="372" class="p" fill="#9ca8b8">Start</text><rect x="164.0" y="364" width="16" height="10" rx="2" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="186.0" y="372" class="p" fill="#9ca8b8">The database goes back first</text><rect x="378.0" y="364" width="16" height="10" rx="2" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="400.0" y="372" class="p" fill="#9ca8b8">Where every rollback ends</text>
</svg>
