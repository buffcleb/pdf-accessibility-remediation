<path d="M 748,68 H 784" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#rollback-decision-dark-arrow-muted)"/>
<path d="M 280,108 V 160" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#rollback-decision-dark-arrow-muted)"/>
