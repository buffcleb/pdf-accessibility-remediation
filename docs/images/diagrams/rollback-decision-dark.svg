<svg viewBox="0 0 960 392" width="960" height="392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollback-decision-dark-title rollback-decision-dark-desc">
<title id="rollback-decision-dark-title">Rolling back: which way</title>
<desc id="rollback-decision-dark-desc">When a release breaks something: a small, clear fix goes forward; otherwise, a release without a migration is rolled back by deploying the earlier images; with a migration the database goes back first, by downgrade when that is safe, or by restoring the backup deploy.sh made, and then the earlier release is deployed.</desc>
<defs><marker id="rollback-decision-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="rollback-decision-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="rollback-decision-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>

<path d="M 176,68 H 212" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#rollback-decision-dark-arrow-muted)"/>
<path d="M 348,68 H 412" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#rollback-decision-dark-arrow-muted)"/>
