<svg viewBox="0 0 960 525" width="960" height="525" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scripting-flow-title scripting-flow-desc">
<title id="scripting-flow-title">A script&#x27;s round trip</title>
<desc id="scripting-flow-desc">A script posts PDFs with its token and learns, for each, its job id or why it was refused; documents for an option that asks first wait for the person to send them, unless the token confirms automatically; with status access the script checks each job; with download access it lists the finished documents it hasn&#x27;t fetched yet and downloads each one&#x27;s zip.</desc>
<defs><marker id="scripting-flow-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="scripting-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="scripting-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>
<line x1="864" y1="64" x2="864" y2="501" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="480" y1="64" x2="480" y2="501" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="96" y1="64" x2="96" y2="501" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><rect x="392" y="156" width="560" height="64" rx="4" fill="rgba(23,32,48,0.02)" stroke="rgba(23,32,48,0.22)" stroke-width="1"/><rect x="392" y="156" width="40" height="16" rx="2" fill="#f5f7fa" stroke="rgba(23,32,48,0.22)" stroke-width="1"/><text x="412" y="167" class="b" text-anchor="middle" fill="#536074">OPT</text><text x="440" y="167" class="a" fill="#536074">[an option that asks before sending]</text><rect x="8" y="228" width="560" height="100" rx="4" fill="rgba(23,32,48,0.02)" stroke="rgba(23,32,48,0.22)" stroke-width="1"/><rect x="8" y="228" width="40" height="16" rx="2" fill="#f5f7fa" stroke="rgba(23,32,48,0.22)" stroke-width="1"/><text x="28" y="239" class="b" text-anchor="middle" fill="#536074">LOOP</text><text x="56" y="239" class="a" fill="#536074">[a token that may check status]</text>
<path d="M 100,108 H 474" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 476,144 H 102" fill="none" stroke="#536074" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 860,196 H 486" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 100,268 H 474" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 476,304 H 102" fill="none" stroke="#536074" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 100,373 H 474" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 476,409 H 102" fill="none" stroke="#536074" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 100,445 H 474" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#scripting-flow-arrow-muted)"/>
<path d="M 476,481 H 102" fill="none" stroke="#1f4e8c" stroke-width="1.4" marker-end="url(#scripting-flow-arrow-accent)"/>
<rect x="191" y="91" width="194" height="13" fill="#f5f7fa"/><text x="288" y="101" class="p" text-anchor="middle" fill="#536074">POST /api/v1/jobs with the PDFs</text><rect x="155" y="127" width="266" height="13" fill="#f5f7fa"/><text x="288" y="137" class="p" text-anchor="middle" fill="#536074">each file: accepted with job.id, or why not</text><rect x="542" y="179" width="260" height="13" fill="#f1f3f6"/><text x="672" y="189" class="p" text-anchor="middle" fill="#536074">Send (or the token confirms automatically)</text><rect x="221" y="251" width="134" height="13" fill="#f1f3f6"/><text x="288" y="261" class="p" text-anchor="middle" fill="#536074">GET /api/v1/jobs/{id}</text><rect x="158" y="287" width="260" height="13" fill="#f1f3f6"/><text x="288" y="297" class="p" text-anchor="middle" fill="#536074">status: queued ... completed, failed, held</text><rect x="206" y="343" width="164" height="13" fill="#f5f7fa"/><text x="288" y="353" class="p" text-anchor="middle" fill="#536074">GET /documents?status=done</text><rect x="224" y="356" width="128" height="13" fill="#f5f7fa"/><text x="288" y="366" class="p" text-anchor="middle" fill="#536074">&amp;not_downloaded=true</text><rect x="152" y="392" width="272" height="13" fill="#f5f7fa"/><text x="288" y="402" class="p" text-anchor="middle" fill="#536074">finished documents this token hasn&#x27;t fetched</text><rect x="212" y="428" width="152" height="13" fill="#f5f7fa"/><text x="288" y="438" class="p" text-anchor="middle" fill="#536074">GET /jobs/{id}/files.zip</text><rect x="227" y="464" width="122" height="13" fill="#f5f7fa"/><text x="288" y="474" class="p" text-anchor="middle" fill="#536074">each document&#x27;s zip</text>
<rect x="24.0" y="16" width="144" height="48" rx="6" fill="#f5f7fa"/><rect x="24.0" y="16" width="144" height="48" rx="6" fill="rgba(83,96,116,0.1)" stroke="#536074" stroke-width="1"/><text x="96.0" y="38.0" class="n" text-anchor="middle" fill="#172030">Script</text><text x="96.0" y="52.0" class="s" text-anchor="middle" fill="#536074">with its token</text>
<rect x="408.0" y="16" width="144" height="48" rx="6" fill="#f5f7fa"/><rect x="408.0" y="16" width="144" height="48" rx="6" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="480.0" y="38.0" class="n" text-anchor="middle" fill="#172030">Portal API</text><text x="480.0" y="52.0" class="s" text-anchor="middle" fill="#536074">/api/v1</text>
<rect x="792.0" y="16" width="144" height="48" rx="6" fill="#f5f7fa"/><rect x="792.0" y="16" width="144" height="48" rx="6" fill="rgba(83,96,116,0.1)" stroke="#536074" stroke-width="1"/><text x="864.0" y="38.0" class="n" text-anchor="middle" fill="#172030">Person</text><text x="864.0" y="52.0" class="s" text-anchor="middle" fill="#536074">My documents</text>

</svg>
