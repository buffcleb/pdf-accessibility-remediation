<rect x="232" y="200" width="168" height="56" rx="6" fill="#f5f7fa"/><rect x="232" y="200" width="168" height="56" rx="6" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="316.0" y="226.0" class="n" text-anchor="middle" fill="#172030">deploy.sh</text><text x="316.0" y="240.0" class="s" text-anchor="middle" fill="#536074">splits, then restarts</text>
