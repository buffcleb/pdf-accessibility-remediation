<rect x="360" y="156" width="28" height="12" rx="2" fill="#f5f7fa"/><text x="374" y="165" class="a" text-anchor="middle" fill="#536074">RUNS</text><rect x="128" y="166" width="56" height="12" rx="2" fill="#f5f7fa"/><text x="156" y="175" class="a" text-anchor="middle" fill="#536074">FILLED IN</text><rect x="424" y="208" width="48" height="12" rx="2" fill="#f5f7fa"/><text x="448" y="217" class="a" text-anchor="middle" fill="#1f4e8c">SECRETS</text>
