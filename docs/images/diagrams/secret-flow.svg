<rect x="496" y="216" width="432" height="24" rx="4" fill="#f5f7fa"/><rect x="496" y="216" width="432" height="24" rx="4" fill="rgba(23,32,48,0.05)" stroke="#536074" stroke-width="0.8"/><text x="504" y="232" class="c" fill="#172030">pdfrem-portal-env</text><text x="920" y="232" class="s" text-anchor="end" fill="#536074">portal, its Redis, SeaweedFS</text>
<rect x="496" y="252" width="432" height="24" rx="4" fill="#f5f7fa"/><rect x="496" y="252" width="432" height="24" rx="4" fill="rgba(23,32,48,0.05)" stroke="#536074" stroke-width="0.8"/><text x="504" y="268" class="c" fill="#172030">pdfrem-monitoring-env</text><text x="920" y="268" class="s" text-anchor="end" fill="#536074">exporter, Grafana (optional)</text>
