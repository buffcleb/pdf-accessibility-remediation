<rect x="496" y="108" width="432" height="24" rx="4" fill="#f5f7fa"/><rect x="496" y="108" width="432" height="24" rx="4" fill="rgba(23,32,48,0.05)" stroke="#536074" stroke-width="0.8"/><text x="504" y="124" class="c" fill="#172030">pdfrem-gateway-env</text><text x="920" y="124" class="s" text-anchor="end" fill="#536074">the AI gateway</text>
