<svg viewBox="0 0 960 360" width="960" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secret-flow-title secret-flow-desc">
<title id="secret-flow-title">How secrets are kept</title>
<desc id="secret-flow-desc">The values live in engine.env and portal.env on the administrator&#x27;s machine, or the password manager; deploy.sh splits them into Kubernetes secrets so each pod gets only what it reads, and restarts the pods whose settings changed; rotate-secret.sh makes a new value, sets a database role&#x27;s password first, writes the file and runs deploy.sh.</desc>
<defs><marker id="secret-flow-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="secret-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="secret-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>
<rect x="16" y="40" width="400" height="264" rx="8" fill="rgba(23,32,48,0.02)" stroke="rgba(23,32,48,0.14)" stroke-width="0.8"/><rect x="28" y="34" width="152" height="12" rx="2" fill="#f5f7fa"/><text x="32" y="43" class="e" fill="#536074">THE ADMINISTRATOR&#x27;S MACHINE</text><rect x="480" y="40" width="464" height="264" rx="8" fill="rgba(23,32,48,0.02)" stroke="rgba(23,32,48,0.14)" stroke-width="0.8"/><rect x="492" y="34" width="221" height="12" rx="2" fill="#f5f7fa"/><text x="496" y="43" class="e" fill="#536074">THE CLUSTER · ONE SECRET PER KIND OF POD</text>
