<svg viewBox="0 0 960 488" width="960" height="488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-access-dark-title service-access-dark-desc">
<title id="service-access-dark-title">Who can use a service, and where pages come from</title>
<desc id="service-access-dark-desc">A service is used only after a super admin switches it on, a group admin enables it for the group (never an external one for a local-only group), it is given to everyone or person by person, and the person picks it; then pages are reserved on every service the document uses, from the global pool, the group pool and the person&#x27;s limit at once; if any is short the upload is refused, naming it, otherwise it is queued.</desc>
<defs><marker id="service-access-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="service-access-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="service-access-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>
<rect x="16" y="232" width="432" height="136" rx="8" fill="rgba(229,233,239,0.02)" stroke="rgba(229,233,239,0.14)" stroke-width="0.8"/><rect x="28" y="226" width="210" height="12" rx="2" fill="#10141a"/><text x="32" y="235" class="e" fill="#9ca8b8">PAGES, PER SERVICE · ALL THREE CHECKED</text>
<path d="M 224,76 H 256" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#service-access-dark-arrow-muted)"/>
<path d="M 464,76 H 496" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#service-access-dark-arrow-muted)"/>
<path d="M 704,76 H 736" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#service-access-dark-arrow-muted)"/>
<path d="M 840,104 V 292 Q 840,300 832,300 H 680" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#service-access-dark-arrow-muted)"/>
<path d="M 448,300 H 520" fill="none" stroke="#9ca8b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#service-access-dark-arrow-muted)"/>
<path d="M 600,260 V 208" fill="none" stroke="#86b4ee" stroke-width="1.4" marker-end="url(#service-access-dark-arrow-accent)"/>
<path d="M 600,340 V 372" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#service-access-dark-arrow-muted)"/>
<rect x="466" y="280" width="36" height="12" rx="2" fill="#10141a"/><text x="484" y="289" class="a" text-anchor="middle" fill="#9ca8b8">PAGES</text><rect x="608" y="228" width="56" height="12" rx="2" fill="#10141a"/><text x="636" y="237" class="a" text-anchor="middle" fill="#86b4ee">ANY SHORT</text>
<rect x="16" y="48" width="208" height="56" rx="6" fill="#10141a"/><rect x="16" y="48" width="208" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="120.0" y="74.0" class="n" text-anchor="middle" fill="#e5e9ef">Super admin</text><text x="120.0" y="88.0" class="s" text-anchor="middle" fill="#9ca8b8">switches it on</text>
<rect x="256" y="48" width="208" height="56" rx="6" fill="#10141a"/><rect x="256" y="48" width="208" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="360.0" y="74.0" class="n" text-anchor="middle" fill="#e5e9ef">Group admin</text><text x="360.0" y="88.0" class="s" text-anchor="middle" fill="#9ca8b8">enables it for the group</text>
<rect x="496" y="48" width="208" height="56" rx="6" fill="#10141a"/><rect x="496" y="48" width="208" height="56" rx="6" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="600.0" y="74.0" class="n" text-anchor="middle" fill="#e5e9ef">To the people</text><text x="600.0" y="88.0" class="s" text-anchor="middle" fill="#9ca8b8">everyone, or one by one</text>
<rect x="736" y="48" width="208" height="56" rx="6" fill="#10141a"/><rect x="736" y="48" width="208" height="56" rx="6" fill="rgba(156,168,184,0.1)" stroke="#9ca8b8" stroke-width="1"/><text x="840.0" y="74.0" class="n" text-anchor="middle" fill="#e5e9ef">The person picks it</text><text x="840.0" y="88.0" class="s" text-anchor="middle" fill="#9ca8b8">at upload, or a fixed level</text>
<text x="256" y="128" class="p" style="font-size:11px" text-anchor="start" fill="#9ca8b8">A group admin can&#x27;t enable an external service for a local-only group.</text>
<rect x="32" y="264" width="400" height="24" rx="4" fill="#10141a"/><rect x="32" y="264" width="400" height="24" rx="4" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="0.8"/><text x="40" y="280" class="c" fill="#e5e9ef">Global pool</text><text x="424" y="280" class="s" text-anchor="end" fill="#9ca8b8">optional, for everyone</text>
<rect x="32" y="296" width="400" height="24" rx="4" fill="#10141a"/><rect x="32" y="296" width="400" height="24" rx="4" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="0.8"/><text x="40" y="312" class="c" fill="#e5e9ef">Group pool</text><text x="424" y="312" class="s" text-anchor="end" fill="#9ca8b8">ticketed top-ups</text>
<rect x="32" y="328" width="400" height="24" rx="4" fill="#10141a"/><rect x="32" y="328" width="400" height="24" rx="4" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="0.8"/><text x="40" y="344" class="c" fill="#e5e9ef">Person&#x27;s limit</text><text x="424" y="344" class="s" text-anchor="end" fill="#9ca8b8">their own, or the group&#x27;s default</text>
<polygon points="600,260.0 680.0,300 600,340.0 520.0,300" fill="#10141a"/><polygon points="600,260.0 680.0,300 600,340.0 520.0,300" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="600" y="297" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">Reserve</text><text x="600" y="311" class="c" style="font-weight:600" text-anchor="middle" fill="#e5e9ef">pages?</text>
<rect x="504" y="152" width="192" height="56" rx="6" fill="#10141a"/><rect x="504" y="152" width="192" height="56" rx="6" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="600.0" y="178.0" class="n" text-anchor="middle" fill="#e5e9ef">Refused</text><text x="600.0" y="192.0" class="s" text-anchor="middle" fill="#9ca8b8">names the service and level</text>
<rect x="520" y="372" width="160" height="56" rx="28" fill="#10141a"/><rect x="520" y="372" width="160" height="56" rx="28" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="600.0" y="398.0" class="n" text-anchor="middle" fill="#e5e9ef">Queued</text><text x="600.0" y="412.0" class="s" text-anchor="middle" fill="#9ca8b8">pages reserved</text>
<line x1="16" y1="448" x2="944" y2="448" stroke="rgba(229,233,239,0.12)" stroke-width="0.8"/><text x="16" y="468" class="e" fill="#9ca8b8">LEGEND</text><rect x="88" y="460" width="16" height="10" rx="2" fill="#171d25" stroke="#e5e9ef" stroke-width="1"/><text x="110" y="468" class="p" fill="#9ca8b8">Who switches it on</text><rect x="242.0" y="460" width="16" height="10" rx="2" fill="rgba(156,168,184,0.1)" stroke="#9ca8b8" stroke-width="1"/><text x="264.0" y="468" class="p" fill="#9ca8b8">The person</text><rect x="348.0" y="460" width="16" height="10" rx="2" fill="rgba(229,233,239,0.05)" stroke="#9ca8b8" stroke-width="1"/><text x="370.0" y="468" class="p" fill="#9ca8b8">Pages</text><rect x="424.0" y="460" width="16" height="10" rx="2" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="446.0" y="468" class="p" fill="#9ca8b8">Refused, with the reason</text>
</svg>
