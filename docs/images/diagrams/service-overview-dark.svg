<svg viewBox="0 0 960 648" width="960" height="648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-overview-dark-title service-overview-dark-desc">
<title id="service-overview-dark-title">What the service runs</title>
<desc id="service-overview-dark-desc">The service&#x27;s parts on the cluster: people reach the ingress controller over HTTPS; the portal (web, portal-api, portal-worker, optional clamav) sends documents to the engine (engine-api, engine-worker, verapdf, litellm); both keep their data in block storage and the shared job folder; only the AI gateway, through the optional egress proxy, and the portal&#x27;s mail leave the cluster.</desc>
