<rect x="536.0" y="16" width="144" height="48" rx="6" fill="#10141a"/><rect x="536.0" y="16" width="144" height="48" rx="6" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="608.0" y="38.0" class="n" text-anchor="middle" fill="#e5e9ef">Portal API</text><text x="608.0" y="52.0" class="s" text-anchor="middle" fill="#9ca8b8">portal-api</text>
<rect x="792.0" y="16" width="144" height="48" rx="6" fill="#10141a"/><rect x="792.0" y="16" width="144" height="48" rx="6" fill="rgba(229,233,239,0.03)" stroke="rgba(229,233,239,0.45)" stroke-width="1"/><text x="864.0" y="38.0" class="n" text-anchor="middle" fill="#e5e9ef">Mail</text><text x="864.0" y="52.0" class="s" text-anchor="middle" fill="#9ca8b8">the campus relay</text>

</svg>
