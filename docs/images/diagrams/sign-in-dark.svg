<path d="M 604,230 H 358" fill="none" stroke="#9ca8b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sign-in-dark-arrow-muted)"/>
<path d="M 612,266 H 858" fill="none" stroke="#9ca8b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sign-in-dark-arrow-muted)"/>
