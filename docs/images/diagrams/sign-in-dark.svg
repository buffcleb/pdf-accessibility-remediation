<path d="M 356,374 H 602" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#sign-in-dark-arrow-muted)"/>
<path d="M 604,423 H 358" fill="none" stroke="#86b4ee" stroke-width="1.4" marker-end="url(#sign-in-dark-arrow-accent)"/>
<path d="M 356,475 H 602" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#sign-in-dark-arrow-muted)"/>
<path d="M 356,524 H 602" fill="none" stroke="#9ca8b8" stroke-width="1.2" marker-end="url(#sign-in-dark-arrow-muted)"/>
<rect x="172" y="91" width="104" height="13" fill="#10141a"/><text x="224" y="101" class="p" text-anchor="middle" fill="#9ca8b8">enter work email</text><rect x="380" y="127" width="200" height="13" fill="#10141a"/><text x="480" y="137" class="p" text-anchor="middle" fill="#9ca8b8">ask for a code (bot check if on)</text><rect x="640" y="174" width="194" height="13" fill="#10141a"/><text x="644" y="184" class="p" text-anchor="start" fill="#9ca8b8">rate limits per address and IP;</text><rect x="640" y="187" width="194" height="13" fill="#10141a"/><text x="644" y="197" class="p" text-anchor="start" fill="#9ca8b8">a 6-digit code, kept as an HMAC</text><rect x="359" y="213" width="242" height="13" fill="#10141a"/><text x="480" y="223" class="p" text-anchor="middle" fill="#9ca8b8">&#x27;code sent&#x27;: the same for every address</text><rect x="654" y="249" width="164" height="13" fill="#10141a"/><text x="736" y="259" class="p" text-anchor="middle" fill="#9ca8b8">the code, after the answer</text><rect x="377" y="285" width="206" height="13" fill="#10141a"/><text x="480" y="295" class="p" text-anchor="middle" fill="#9ca8b8">email: the code, valid 10 minutes</text><rect x="181" y="321" width="86" height="13" fill="#10141a"/><text x="224" y="331" class="p" text-anchor="middle" fill="#9ca8b8">type the code</text><rect x="401" y="357" width="158" height="13" fill="#10141a"/><text x="480" y="367" class="p" text-anchor="middle" fill="#9ca8b8">check it (a few attempts)</text><rect x="380" y="393" width="200" height="13" fill="#10141a"/><text x="480" y="403" class="p" text-anchor="middle" fill="#9ca8b8">access token (10 min, in memory)</text><rect x="368" y="406" width="224" height="13" fill="#10141a"/><text x="480" y="416" class="p" text-anchor="middle" fill="#9ca8b8">+ refresh cookie (HttpOnly, rotated)</text><rect x="383" y="458" width="194" height="13" fill="#14181e"/><text x="480" y="468" class="p" text-anchor="middle" fill="#9ca8b8">API calls with the access token</text><rect x="392" y="494" width="176" height="13" fill="#14181e"/><text x="480" y="504" class="p" text-anchor="middle" fill="#9ca8b8">refresh: new tokens; reusing</text><rect x="395" y="507" width="170" height="13" fill="#14181e"/><text x="480" y="517" class="p" text-anchor="middle" fill="#9ca8b8">an old one ends the session</text>
