<svg viewBox="0 0 960 588" width="960" height="588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sign-in-title sign-in-desc">
<title id="sign-in-title">Signing in</title>
<desc id="sign-in-desc">A person enters their email; the portal applies rate limits, makes a 6-digit code kept only as an HMAC, and gives the same answer for every address, emailing the code afterwards; the person types it in, and the portal returns a 10-minute access token kept in memory and a refresh cookie that is rotated on each use, reuse of an old one ending the session.</desc>
<defs><marker id="sign-in-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="sign-in-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="sign-in-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>
<line x1="864" y1="64" x2="864" y2="564" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="608" y1="64" x2="608" y2="564" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="352" y1="64" x2="352" y2="564" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><line x1="96" y1="64" x2="96" y2="564" stroke="rgba(23,32,48,0.25)" stroke-width="1" stroke-dasharray="4,4"/><rect x="264" y="435" width="432" height="113" rx="4" fill="rgba(23,32,48,0.02)" stroke="rgba(23,32,48,0.22)" stroke-width="1"/><rect x="264" y="435" width="40" height="16" rx="2" fill="#f5f7fa" stroke="rgba(23,32,48,0.22)" stroke-width="1"/><text x="284" y="446" class="b" text-anchor="middle" fill="#536074">LOOP</text><text x="312" y="446" class="a" fill="#536074">[while signed in]</text>
