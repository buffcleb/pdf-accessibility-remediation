<rect x="536.0" y="16" width="144" height="48" rx="6" fill="#f5f7fa"/><rect x="536.0" y="16" width="144" height="48" rx="6" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="608.0" y="38.0" class="n" text-anchor="middle" fill="#172030">Portal API</text><text x="608.0" y="52.0" class="s" text-anchor="middle" fill="#536074">portal-api</text>
<rect x="792.0" y="16" width="144" height="48" rx="6" fill="#f5f7fa"/><rect x="792.0" y="16" width="144" height="48" rx="6" fill="rgba(23,32,48,0.03)" stroke="rgba(23,32,48,0.45)" stroke-width="1"/><text x="864.0" y="38.0" class="n" text-anchor="middle" fill="#172030">Mail</text><text x="864.0" y="52.0" class="s" text-anchor="middle" fill="#536074">the campus relay</text>

</svg>
