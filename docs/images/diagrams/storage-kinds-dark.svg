<svg viewBox="0 0 960 504" width="960" height="504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-kinds-dark-title storage-kinds-dark-desc">
<title id="storage-kinds-dark-title">Two kinds of storage</title>
<desc id="storage-kinds-dark-desc">A database&#x27;s block disk is attached to one server at a time, the one running its pod, and the storage driver moves it when the pod moves; the engine&#x27;s job folder is one NFS share that every server mounts at once.</desc>
