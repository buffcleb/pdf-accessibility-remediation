<svg viewBox="0 0 960 640" width="960" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-context-title system-context-desc">
<title id="system-context-title">System context</title>
<desc id="system-context-desc">The portal (web, portal-api, portal-worker, optional ClamAV, with PostgreSQL, its own Redis and an encrypted object store) sends documents to the engine (engine API, workers, Adobe worker, veraPDF and Tesseract, with a Redis queue and a shared job folder); every AI call goes through the AI gateway to local models, or cloud models when turned on; the Adobe worker reaches Adobe PDF Services when turned on; browsers and scripts with a personal API token reach the portal over HTTPS.</desc>
