<rect x="792.0" y="16" width="144" height="48" rx="6" fill="#10141a"/><rect x="792.0" y="16" width="144" height="48" rx="6" fill="rgba(134,180,238,0.08)" stroke="#86b4ee" stroke-width="1"/><text x="864.0" y="38.0" class="n" text-anchor="middle" fill="#e5e9ef">Engine</text><text x="864.0" y="52.0" class="s" text-anchor="middle" fill="#9ca8b8">engine API, worker</text>

