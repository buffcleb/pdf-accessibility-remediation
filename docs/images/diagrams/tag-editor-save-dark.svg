<rect x="83" y="91" width="218" height="13" fill="#10141a"/><text x="192" y="101" class="p" text-anchor="middle" fill="#9ca8b8">edit: role, alt text, cells, order,</text><rect x="131" y="104" width="122" height="13" fill="#10141a"/><text x="192" y="114" class="p" text-anchor="middle" fill="#9ca8b8">merge, split, areas</text><rect x="320" y="151" width="158" height="13" fill="#10141a"/><text x="324" y="161" class="p" text-anchor="start" fill="#9ca8b8">offers only valid changes</text><rect x="320" y="164" width="182" height="13" fill="#10141a"/><text x="324" y="174" class="p" text-anchor="start" fill="#9ca8b8">(roles.ts mirrors the engine)</text><rect x="194" y="190" width="188" height="13" fill="#10141a"/><text x="288" y="200" class="p" text-anchor="middle" fill="#9ca8b8">save, with AI review if wanted</text><rect x="458" y="226" width="236" height="13" fill="#10141a"/><text x="576" y="236" class="p" text-anchor="middle" fill="#9ca8b8">new version &#x27;Human reviewed N&#x27;, queued</text><rect x="680" y="262" width="176" height="13" fill="#10141a"/><text x="768" y="272" class="p" text-anchor="middle" fill="#9ca8b8">POST /edit: base PDF + edits</text><rect x="784" y="309" width="74" height="13" fill="#10141a"/><text x="854" y="319" class="p" text-anchor="end" fill="#9ca8b8">apply them;</text><rect x="694" y="322" width="164" height="13" fill="#10141a"/><text x="854" y="332" class="p" text-anchor="end" fill="#9ca8b8">pages stay pixel-identical</text><rect x="688" y="359" width="170" height="13" fill="#10141a"/><text x="854" y="369" class="p" text-anchor="end" fill="#9ca8b8">integrity (fails the save),</text><rect x="676" y="372" width="182" height="13" fill="#10141a"/><text x="854" y="382" class="p" text-anchor="end" fill="#9ca8b8">semantics, veraPDF, AI review</text><rect x="464" y="398" width="224" height="13" fill="#10141a"/><text x="576" y="408" class="p" text-anchor="middle" fill="#9ca8b8">new version ready: tag map, findings</text>
