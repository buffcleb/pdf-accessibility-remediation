<svg viewBox="0 0 960 459" width="960" height="459" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-editor-save-dark-title tag-editor-save-dark-desc">
<title id="tag-editor-save-dark-title">Saving edits in the tag manager</title>
<desc id="tag-editor-save-dark-desc">A reviewer edits tags in the tag manager, which offers only valid changes; saving queues a new version, the portal worker sends the base version&#x27;s PDF and the edits to the engine, which applies them with the pages unchanged and checks integrity, semantics, veraPDF and, if asked, AI review; the new version then appears with its tag map and findings.</desc>
<defs><marker id="tag-editor-save-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca8b8"/></marker><marker id="tag-editor-save-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86b4ee"/></marker><marker id="tag-editor-save-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cc6cc"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#10141a"/>
