<svg viewBox="0 0 960 384" width="960" height="384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verification-layers-title verification-layers-desc">
<title id="verification-layers-title">Three layers of checks, then a person</title>
<desc id="verification-layers-desc">Every output is checked in three layers: integrity, which fails the job or save on any error; semantics and an AI review by a model of another family, which add to the review list; and the review list goes to a person, who fixes what matters in the tag manager.</desc>
<defs><marker id="verification-layers-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#536074"/></marker><marker id="verification-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f4e8c"/></marker><marker id="verification-layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker><style>.n{font:600 12px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.c{font:500 11px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.p{font:400 10px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.s{font:400 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.e{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.14em}.t{font:500 7px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.b{font:500 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.08em}.a{font:400 8px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:.06em}</style></defs>
<rect width="100%" height="100%" fill="#f5f7fa"/>

<path d="M 480,88 V 96" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#verification-layers-arrow-muted)"/>
<path d="M 480,168 V 176" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#verification-layers-arrow-muted)"/>
<path d="M 480,248 V 256" fill="none" stroke="#536074" stroke-width="1.2" marker-end="url(#verification-layers-arrow-muted)"/>

<rect x="16" y="16" width="928" height="72" rx="6" fill="#f5f7fa"/><rect x="16" y="16" width="928" height="72" rx="6" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><rect x="28" y="28" width="28" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="42" y="37" class="t" text-anchor="middle" fill="#1f4e8c">L1</text><text x="68" y="39" class="n" style="font-size:13px" fill="#172030">Integrity</text><text x="928" y="39" class="c" style="font-weight:600" text-anchor="end" fill="#1f4e8c">Fails the job (or the save)</text><text x="68" y="58" class="s" fill="#536074">pikepdf and its own content-stream scan, no code shared with the tagger</text><text x="68" y="72" class="s" fill="#536074">each sequence in one tag; ParentTree, roles, balanced marked content, nesting</text>
<rect x="16" y="96" width="928" height="72" rx="6" fill="#f5f7fa"/><rect x="16" y="96" width="928" height="72" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="28" y="108" width="28" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="42" y="117" class="t" text-anchor="middle" fill="#536074">L2</text><text x="68" y="119" class="n" style="font-size:13px" fill="#172030">Semantics</text><text x="928" y="119" class="c" style="font-weight:600" text-anchor="end" fill="#536074">Review list</text><text x="68" y="138" class="s" fill="#536074">pdfplumber, independent of PyMuPDF</text><text x="68" y="152" class="s" fill="#536074">headings, figures, hidden text, tables, lists, links, order, language, contrast</text>
<rect x="16" y="176" width="928" height="72" rx="6" fill="#f5f7fa"/><rect x="16" y="176" width="928" height="72" rx="6" fill="#ffffff" stroke="#172030" stroke-width="1"/><rect x="28" y="188" width="28" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="42" y="197" class="t" text-anchor="middle" fill="#536074">L3</text><text x="68" y="199" class="n" style="font-size:13px" fill="#172030">AI review</text><text x="928" y="199" class="c" style="font-weight:600" text-anchor="end" fill="#536074">Review list</text><text x="68" y="218" class="s" fill="#536074">rendered images and a review model from another family</text><text x="68" y="232" class="s" fill="#536074">alt text right, partly wrong or wrong; charts, formulas, music; 10% or every figure</text>
<rect x="16" y="256" width="928" height="72" rx="6" fill="#f5f7fa"/><rect x="16" y="256" width="928" height="72" rx="6" fill="rgba(23,32,48,0.02)" stroke="#536074" stroke-width="1" stroke-dasharray="4,3"/><rect x="28" y="268" width="28" height="12" rx="2" fill="none" stroke="rgba(23,32,48,0.3)" stroke-width="0.8"/><text x="42" y="277" class="t" text-anchor="middle" fill="#536074">→</text><text x="68" y="279" class="n" style="font-size:13px" fill="#172030">A person</text><text x="928" y="279" class="c" style="font-weight:600" text-anchor="end" fill="#536074">Decides</text><text x="68" y="298" class="s" fill="#536074">the Needs review list, most important first</text><text x="68" y="312" class="s" fill="#536074">fixes in the tag manager, which runs these checks again on every save</text>
<line x1="16" y1="344" x2="944" y2="344" stroke="rgba(23,32,48,0.12)" stroke-width="0.8"/><text x="16" y="364" class="e" fill="#536074">LEGEND</text><rect x="88" y="356" width="16" height="10" rx="2" fill="rgba(31,78,140,0.08)" stroke="#1f4e8c" stroke-width="1"/><text x="110" y="364" class="p" fill="#536074">Blocks the result</text><rect x="236.0" y="356" width="16" height="10" rx="2" fill="#ffffff" stroke="#172030" stroke-width="1"/><text x="258.0" y="364" class="p" fill="#536074">Adds to the review list</text><rect x="420.0" y="356" width="16" height="10" rx="2" fill="rgba(23,32,48,0.02)" stroke="#536074" stroke-width="1" stroke-dasharray="4,3"/><text x="442.0" y="364" class="p" fill="#536074">A person</text>
</svg>
